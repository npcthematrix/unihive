<!--
  UniHive favicon: 基于 logo.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- 蜂巢外轮廓 (六边形) -->
  <polygon
    points="58.67,32 45.33,11.6 18.67,11.6 5.33,32 18.67,52.4 45.33,52.4"
    fill="#7C3AED" fill-opacity="0.12"
    stroke="url(#uh-stroke)" stroke-width="3"
    stroke-linejoin="round"/>

  <!-- 太极图案 -->
  <g transform="translate(32, 32)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <!-- 阴鱼 (紫色) -->
    <path d="M0,-9 A9,9 0 0,1 0,9 A4.5,4.5 0 0,1 0,0 A4.5,4.5 0 0,0 0,-9" fill="#7C3AED"/>
    <!-- 阳鱼 (白色) -->
    <path d="M0,9 A9,9 0 0,1 0,-9 A4.5,4.5 0 0,1 0,0 A4.5,4.5 0 0,0 0,9" fill="#FFFFFF"/>
    <!-- 阴眼 (白色) -->
    <circle cx="0" cy="-4.5" r="2" fill="#FFFFFF"/>
    <!-- 阳眼 (紫色) -->
    <circle cx="0" cy="4.5" r="2" fill="#7C3AED"/>
  </g>
</svg>
