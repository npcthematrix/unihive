<!--
  PWA icon 192x192: 同 favicon 几何 (蜂巢 + 6 入 1 汇聚), 放大约 3x。
  改此处同步 512/maskable/favicon。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="pwa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a8c"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pwa-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.6" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="pwa-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e3a8c"/>
    </radialGradient>
    <radialGradient id="pwa-glass" cx="0.3" cy="0.3" r="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" rx="36" fill="url(#pwa-bg)"/>
  <polygon points="176,96 136,34.8 56,34.8 16,96 56,157.2 136,157.2"
    fill="none" stroke="url(#pwa-stroke)" stroke-width="9" stroke-linejoin="round"/>
  <g stroke="url(#pwa-stroke)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="152" y1="96" x2="120" y2="96"/>
    <line x1="124" y1="47.5" x2="108" y2="75.2"/>
    <line x1="68" y1="47.5" x2="84" y2="75.2"/>
    <line x1="40" y1="96" x2="72" y2="96"/>
    <line x1="68" y1="144.5" x2="84" y2="116.8"/>
    <line x1="124" y1="144.5" x2="108" y2="116.8"/>
  </g>
  <circle cx="96" cy="96" r="24" fill="url(#pwa-node)"/>
  <polygon points="96,80 110.4,89 110.4,103 96,112 81.6,103 81.6,89"
    fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.9" stroke-linejoin="round"/>
  <circle cx="96" cy="96" r="24" fill="url(#pwa-glass)"/>
</svg>