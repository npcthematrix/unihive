# THS-LOCAL-GATEWAY 上游 (FQGate 本地网关, http://127.0.0.1:17281/mcp) 工具规格
#
# 87 个工具全部为身份映射 (gateway 工具名 == 上游 MCP 工具名), 经
# tool_loader._GENERATED_FILENAMES 在加载期合并进 /mcp 对外发布。
#
# 参数契约权威来源: 上游 REST OpenAPI (http://127.0.0.1:17281/docs,
# 快照 logs/_openapi.json)。上游 MCP 层 inputSchema 不可信 —— 数组参数
# 误标为 string、required/默认值与运行时不符, 一律以下面 spec 为准。
#
# 再生成: python scripts/gen_ths_local_tools.py (依赖 logs/_openapi.json + logs/_tools_list.sse 快照)
tools:
  - {name: fqgate_market_bid_ask_rank, description: "返回买卖盘排名", routing: fqgate_market_bid_ask_rank, params: [{name: code, type: str, required: true, description: "不带市场前缀的证券代码。"}, {name: market, type: str, required: true, description: "四字符市场代码，与代码参数组合使用。常用值：USHA=上海A股，USZA=深圳A股，USTM=北交所，USHI=上海指数，USZI=深圳指数，URFI=同花顺行业/概念板块，UHKG=港股，UNQQ=美股，UFXB=外汇。国内股票/指数为「4位市场码+6位代码」共10位（如 USHA600519、USHI000001）；查指数必须用 USHI/USZI，不能用 USHA/USZA；国际品种为「4位市场码+可变长度代码」（如 UNQQTSLA）。"}, {name: requestTimeoutMs, type: int, required: false, description: "请求超时时间(毫秒)，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_bid_ask_rank}, data_source_type: online}
  - {name: fqgate_market_block, description: "根据板块目录中的编号返回板块信息，支持分页。\n对应本机接口：POST /v1/market/catalog/block。", routing: fqgate_market_block, params: [{name: block_id, type: int, required: true, description: "板块目录返回的板块编号。"}, {name: limit, type: int, required: false, description: "本次最多返回的数量；省略时为 50。"}, {name: offset, type: int, required: false, description: "从第几项开始返回，从 0 开始；省略时从第一项开始。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_block}, data_source_type: online}
  - {name: fqgate_market_block_constituents, description: "返回指定板块的成分证券，支持分页。请使用板块详情中的完整板块代码。\n对应本机接口：POST /v1/market/catalog/block-constituents。", routing: fqgate_market_block_constituents, params: [{name: limit, type: int, required: false, description: "本次最多返回的数量；省略时为 50。"}, {name: link_code, type: str, required: true, description: "板块详情返回的完整板块代码。"}, {name: offset, type: int, required: false, description: "从第几项开始返回，从 0 开始；省略时从第一项开始。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_block_constituents}, data_source_type: online}
  - {name: fqgate_market_block_ranking, description: "按指定行情字段返回一个板块内的证券排行。板块编号来自证券与板块目录，支持设置起始位置、返回数量和排序方向。\n对应本机接口：POST /v1/market/rankings/block。", routing: fqgate_market_block_ranking, params: [{name: block_id, type: int, required: true, description: "板块目录返回的板块编号。"}, {name: function_period, type: int, required: false, description: "年报类字段使用的周期编号；普通行情字段请省略。"}, {name: sort_begin, type: int, required: true, description: "从排序结果的第几项开始返回，从 0 开始。"}, {name: sort_count, type: int, required: true, description: "最多返回的证券数量。"}, {name: sort_direction, type: str, required: true, enum: [ascending, descending], description: "证券排序方向。"}, {name: sort_field, type: int, required: true, description: "排序字段编号。常用值：199112 为涨跌幅、19 为成交额、48 为五分钟涨速、900232 为人气排名。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_block_ranking}, data_source_type: online}
  - {name: fqgate_market_bond_lists, description: "返回可查询的债券目录，单页默认返回 50 条。\n对应本机接口：POST /v1/market/catalog/bond。", routing: fqgate_market_bond_lists, params: [{name: limit, type: int, required: false, description: "本次最多返回的数量；省略时为 50。"}, {name: offset, type: int, required: false, description: "从第几项开始返回，从 0 开始；省略时从第一项开始。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_bond_lists}, data_source_type: online}
  - {name: fqgate_market_cached_login, description: "复用本地同花顺客户端登录", routing: fqgate_market_cached_login, params: [{name: client_path, type: str, required: true, description: "运行 FQGate 的电脑上的同花顺安装目录，必须是绝对路径；远航版也接受 bin 目录。"}, {name: requestTimeoutMs, type: int, required: false, description: "请求超时时间(毫秒)，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_cached_login}, data_source_type: online}
  - {name: fqgate_market_call_auction, description: "返回指定证券的集合竞价数据。\n对应本机接口：POST /v1/market/history/call-auction。", routing: fqgate_market_call_auction, params: [{name: code, type: str, required: true, description: "证券代码。"}, {name: market, type: str, required: true, description: "四字符市场代码，与代码参数组合使用。常用值：USHA=上海A股，USZA=深圳A股，USTM=北交所，USHI=上海指数，USZI=深圳指数，URFI=同花顺行业/概念板块，UHKG=港股，UNQQ=美股，UFXB=外汇。国内股票/指数为「4位市场码+6位代码」共10位（如 USHA600519、USHI000001）；查指数必须用 USHI/USZI，不能用 USHA/USZA；国际品种为「4位市场码+可变长度代码」（如 UNQQTSLA）。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_call_auction}, data_source_type: online}
