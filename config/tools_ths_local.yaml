  - {name: fqgate_market_super_tick, description: "返回指定证券的增强逐笔行情，可选择交易日。records 按数据段保留：除逐笔行情外，还可能包含按日提供的补充数据。逐笔段的字段 1 为 Unix 秒时间戳；日级补充段的字段 1 为 YYYYMMDD 日期，可能早于所选交易日。请勿将补充段计入逐笔条数；row_count 为所有段的总行数。\n对应本机接口：POST /v1/market/history/super-tick。", routing: fqgate_market_super_tick, params: [{name: code, type: str, required: true, description: "证券代码。"}, {name: date, type: str, required: false, description: "可选交易日，格式为 YYYYMMDD。"}, {name: market, type: str, required: true, description: "四字符市场代码，与代码参数组合使用。常用值：USHA=上海A股，USZA=深圳A股，USTM=北交所，USHI=上海指数，USZI=深圳指数，URFI=同花顺行业/概念板块，UHKG=港股，UNQQ=美股，UFXB=外汇。国内股票/指数为「4位市场码+6位代码」共10位（如 USHA600519、USHI000001）；查指数必须用 USHI/USZI，不能用 USHA/USZA；国际品种为「4位市场码+可变长度代码」（如 UNQQTSLA）。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_super_tick}, data_source_type: online}
  - {name: fqgate_market_tas_transactions, description: "查询支持 TAS（结算价交易）的期货成交明细。先从期货目录取得实际合约，再通过字段 144 确认 TAS 标识。空记录表示当前行情服务未返回数据。\n对应本机接口：POST /v1/market/history/tas-transactions。", routing: fqgate_market_tas_transactions, params: [{name: code, type: str, required: true, description: "从期货目录取得且支持 TAS 的实际合约代码，例如 `sc2610`。"}, {name: count, type: int, required: true, description: "最近记录数量。"}, {name: date, type: str, required: false, description: "交易日，通常为 YYYYMMDD；非空时原样传递，省略或空字符串时由行情服务确定。"}, {name: end_time, type: int, required: false, description: "查询截止时间，使用 Unix 秒时间戳，而非 HHMMSS；省略或为 0 时不指定。"}, {name: fields, type: array, required: true, description: "需要返回的 TAS 字段编号；不接受普通逐笔成交的字段名称。元素为 integer，如 [1, 5, 10, 12, 13, 18]"}, {name: market, type: str, required: true, description: "四字符期货市场代码，与可变长度合约代码组合：UCFS=国内商品期货（如 sc2610），UIFF=金融期货（如 IF9999）。"}, {name: trace_detail, type: bool, required: false, description: "是否返回逐笔追踪信息。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_tas_transactions}, data_source_type: online}
