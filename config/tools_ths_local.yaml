  - {name: fqgate_market_clear_cached_login, description: "移除当前系统用户安全存储中的行情登录信息，不中断当前行情连接。\n对应本机接口：DELETE /v1/market/session/saved-login。", routing: fqgate_market_clear_cached_login, params: [{name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_clear_cached_login}, data_source_type: online}
