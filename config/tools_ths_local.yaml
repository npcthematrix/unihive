  - {name: fqgate_market_depth, description: "选择提示：用户询问普通五档盘口时使用；十档盘口或逐项委托队列需要 Level-2 工具。\n\n返回买卖五档价格及数量，不包含每档的逐笔委托队列。\n对应本机接口：POST /v1/market/history/depth。", routing: fqgate_market_depth, params: [{name: securities, type: array, required: true, description: "需要查询的证券。元素为对象: {code=不带市场前缀的证券代码; market=同花顺市场代码，例如 `USHA`}，如 [{\"code\": \"600519\", \"market\": \"USHA\"}]"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_depth}, data_source_type: online}
