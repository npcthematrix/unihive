  - {name: fqgate_market_market_ranking, description: "按指定行情字段返回一个市场内的证券排行，支持设置起始位置、返回数量和排序方向。常用排序字段包括涨跌幅 199112、成交额 19、五分钟涨速 48 和人气排名 900232。\n对应本机接口：POST /v1/market/rankings/market。", routing: fqgate_market_market_ranking, params: [{name: function_period, type: int, required: false, description: "年报类字段使用的周期编号；普通行情字段请省略。"}, {name: market, type: str, required: true, description: "四字符市场代码，与代码参数组合使用。常用值：USHA=上海A股，USZA=深圳A股，USTM=北交所，USHI=上海指数，USZI=深圳指数，URFI=同花顺行业/概念板块，UHKG=港股，UNQQ=美股，UFXB=外汇。国内股票/指数为「4位市场码+6位代码」共10位（如 USHA600519、USHI000001）；查指数必须用 USHI/USZI，不能用 USHA/USZA；国际品种为「4位市场码+可变长度代码」（如 UNQQTSLA）。"}, {name: sort_begin, type: int, required: true, description: "从排序结果的第几项开始返回，从 0 开始。"}, {name: sort_count, type: int, required: true, description: "最多返回的证券数量。"}, {name: sort_direction, type: str, required: true, enum: [ascending, descending], description: "证券排序方向。"}, {name: sort_field, type: int, required: true, description: "排序字段编号。常用值：199112 为涨跌幅、19 为成交额、48 为五分钟涨速、900232 为人气排名。"}, {name: requestTimeoutMs, type: int, required: false, description: "本次请求的最长等待时间，单位为毫秒，包含等待、连接及重试。默认 30000。建议客户端等待时间略长于此值。，取值 ≥1"}], upstream_tool_mapping: {THS-LOCAL-GATEWAY: fqgate_market_market_ranking}, data_source_type: online}
