# UniHive Gateway 配置文件

# Gateway 配置
# host 默认仅回环: console 鉴权默认关闭, 非回环绑定等于同网段未认证可写
# /api/* (启动时非回环 + 无鉴权会打 SECURITY WARNING); 需要全网卡可改
# 0.0.0.0 并建议同时配置 UNIHIVE_CONSOLE_* 开启鉴权。
# 2026-09-20: 绑 0.0.0.0 允许局域网 IP 访问, 127.0.0.1 本机访问同样可用。
gateway:
  host: "0.0.0.0"
  port: 18080
  mcp_path: "/mcp"

# Console 控制台认证（默认关闭: 不配置 = /api/* 与控制台开放, 仅适合本机单用户）
#
# 推荐启用方式 —— 在 .env (已 gitignore) 或进程环境里同时设置三个变量:
#   UNIHIVE_CONSOLE_USER=<用户名>
#   UNIHIVE_CONSOLE_PASSWORD=<明文口令, 启动时自动 PBKDF2 哈希>
#   UNIHIVE_CONSOLE_SESSION_SECRET=<32+ 字符随机串;
#       python -c "import secrets; print(secrets.token_hex(32))">
# 三个全设才启用; 只设一两个会 fail-closed 拒启 (防止半配置裸奔);
# 三个全不设才是关闭态。切勿把口令/密钥提交进仓库。
#
# 也可以直接在本段配置 (不推荐, 注意提交风险; 只接受哈希, 不接受明文):
# console:
#   username: "admin"
#   # python -c "from src.unihive.console_auth import hash_password; print(hash_password('your-password'))"
#   password_hash: "<pbkdf2_sha256$...>"
#   session_secret: "<32+ chars random hex>"

# 全局开关
disable_dangerous: false
strict_registry: true

# 缓存配置
cache:
  enabled: true
  db_path: "logs/cache.db"

  ttl:
    index_data: 60
    fundamentals: 3600
    fund_data: 300
    search: 300
    special_data: 60
    valuation: 300
    fund_holdings: 3600
    fund_history: 3600
    ticker_list: 3600
    workday: 86400
    historical: 3600

# 日志配置
logging:
  level: "INFO"
  format: "json"
  path: "logs"
  rotation:
    max_bytes: 10485760
    backup_count: 5
