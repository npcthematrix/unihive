  - {name: a_share_special_data_hot_stock_rank_trend, description: "A 股热门股排名趋势", routing: a_share_special_data_hot_stock_rank_trend, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: start_date, type: str, required: false, description: "起始日期，格式 yyyy-MM-dd"}, {name: end_date, type: str, required: false, description: "结束日期，格式 yyyy-MM-dd，需 >= start_date"}], cache_ttl_key: special_data, data_source_type: online}
  - {name: a_share_special_data_dragon_tiger_list, description: "A 股龙虎榜", routing: a_share_special_data_dragon_tiger_list, params: [{name: board_type, type: str, required: false, enum: [all, org, hot_money], description: "榜单类型：all=全部（默认）/ org=机构榜 / hot_money=游资榜"}, {name: date, type: str, required: false, description: "目标日期，格式 yyyy-MM-dd，省略则默认最近可用交易日"}], cache_ttl_key: special_data, data_source_type: online}
  - {name: a_share_auction_snapshot, description: "A 股集合竞价快照", routing: a_share_auction_snapshot, params: [{name: thscodes, type: str, required: false, description: "逗号分隔的 THS 代码列表，省略则返回全市场"}], cache_ttl_key: special_data, data_source_type: online}
