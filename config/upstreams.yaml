  fund_managers_detail:                       {rhths_fund: get_fund_managers_detail}
  fund_news_article_list:                     {rhths_fund: get_fund_news_article_list}
  fund_offerings_list:                        {rhths_fund: get_fund_offerings_list}
  fund_portfolio_stock_history:               {rhths_fund: get_fund_portfolio_stock_history}
  fund_portfolio_stock_report_dates:          {rhths_fund: get_fund_portfolio_stock_report_dates}
  fund_portfolio_bond_history:                {rhths_fund: get_fund_portfolio_bond_history}
  fund_portfolio_bond_report_dates:           {rhths_fund: get_fund_portfolio_bond_report_dates}
  fund_portfolio_asset_allocation:            {rhths_fund: get_fund_portfolio_asset_allocation}

  # Tushare
  tushare_call:                               {tushare: sdk_call}
  tushare_schema:                             {tushare: sdk_schema}
  tushare_search:                             {tushare: sdk_search}

# 路由配置 (带 fallback 链的 gateway_tool)
routing:
  get_realtime_quote:
    chain: ["tdx_local", "rhths_ashare"]
    description: "实时行情"
  get_daily_bar:
    chain: ["tdx_local", "rhths_ashare"]
    description: "日K线行情"
  get_minute_bar:
    chain: ["tdx_local"]
    description: "分钟K线行情 (TDX)"
  get_trade_detail:
    chain: ["tdx_local"]
    description: "逐笔成交明细"
  get_index:
    chain: ["tdx_local", "rhths_index"]
    description: "指数K线"
  get_index_snapshot:
    chain: ["rhths_index"]
    description: "指数快照"
  get_index_history:
    chain: ["rhths_index"]
    description: "指数历史"
  get_etf:
    chain: ["tdx_local", "rhths_fund"]
    description: "ETF行情"
  get_fund_snapshot:
    chain: ["rhths_fund"]
    description: "基金快照"
  get_fund_nav:
    chain: ["rhths_fund"]
    description: "基金净值"
  get_fundamentals:
    chain: ["rhths_ashare"]
    description: "基本面数据"
  get_valuation:
    chain: ["rhths_ashare"]
    description: "估值快照"
  get_announcement:
    chain: ["rhths_ashare"]
    description: "公告"
  search_stock:
    chain: ["tdx_local", "rhths_meta"]
    description: "股票搜索"
  get_market_stats:
    chain: ["tdx_local"]
    description: "市场统计"
  get_limit_up_pool:
    chain: ["rhths_ashare"]
    description: "涨停池"
  get_sector_flow:
    chain: ["rhths_ashare"]
    description: "板块资金流"

# 对外暴露的工具清单
# 由 registry.py 解析后自动注册为 FastMCP tool
tools:
  # === TDX 直通 (30) ===
  - {name: get_quote, description: "TDX 实时行情", routing: get_quote, params: [{name: code, type: str, required: true, normalize: code}], cache_ttl_key: realtime_quote}
  - {name: get_kline, description: "TDX K线 (day/week/month/minute1/5/15/30/60)", routing: get_kline, params: [{name: code, type: str, required: true, normalize: code}, {name: type, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: daily_bar}
  - {name: get_minute_data, description: "TDX 今日分时(240 根)", routing: get_minute_data, params: [{name: code, type: str, required: true, normalize: code}], cache_ttl_key: minute_bar}
  - {name: get_trade, description: "TDX 逐笔成交", routing: get_trade, params: [{name: code, type: str, required: true, normalize: code}]}
  - {name: get_stock_info, description: "TDX 单只股票综合信息", routing: get_stock_info, params: [{name: code, type: str, required: true, normalize: code}]}
  - {name: get_code_list, description: "TDX 全量代码列表 (sh/sz/bj)", routing: get_code_list, params: [{name: exchange, type: str, required: false}], cache_ttl_key: ticker_list}
  - {name: get_batch_quote, description: "TDX 批量行情", routing: get_batch_quote, params: [{name: codes, type: str, required: true}], cache_ttl_key: realtime_quote}
  - {name: get_kline_history, description: "TDX 历史K线(指定区间)", routing: get_kline_history, params: [{name: code, type: str, required: true, normalize: code}, {name: type, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: historical}
  - {name: get_kline_all, description: "TDX 全量K线(全历史)", routing: get_kline_all, params: [{name: code, type: str, required: true, normalize: code}, {name: type, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: historical}
  - {name: get_kline_all_tdx, description: "TDX 全量K线 (TDX 源)", routing: get_kline_all_tdx, params: [{name: code, type: str, required: true, normalize: code}, {name: type, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: historical}
  - {name: get_kline_all_ths, description: "TDX 全量K线 (同花顺源, 前复权)", routing: get_kline_all_ths, params: [{name: code, type: str, required: true, normalize: code}, {name: type, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: historical}
  - {name: get_index_kline, description: "TDX 指数K线", routing: get_index_kline, params: [{name: code, type: str, required: true}, {name: type, type: str, required: false}], cache_ttl_key: index_data}
  - {name: get_index_all, description: "TDX 全指K线(含成分股)", routing: get_index_all, params: [{name: code, type: str, required: true}, {name: type, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: historical}
  - {name: get_market_count, description: "TDX 市场证券数量统计", routing: get_market_count, params: [], cache_ttl_key: market_stats}
  - {name: get_stock_codes, description: "TDX 代码列表(分页)", routing: get_stock_codes, params: [{name: limit, type: int, required: false}, {name: prefix, type: bool, required: false}], cache_ttl_key: ticker_list}
  - {name: get_etf_codes, description: "TDX ETF 代码列表", routing: get_etf_codes, params: [{name: limit, type: int, required: false}, {name: prefix, type: bool, required: false}], cache_ttl_key: etf_list}
  - {name: get_etf_list, description: "TDX ETF 列表(含基础信息)", routing: get_etf_list, params: [{name: exchange, type: str, required: false}, {name: limit, type: int, required: false}], cache_ttl_key: etf_list}
  - {name: get_trade_history, description: "TDX 历史逐笔(分页)", routing: get_trade_history, params: [{name: code, type: str, required: true, normalize: code}, {name: date, type: str, required: false}, {name: start, type: int, required: false}, {name: count, type: int, required: false}]}
  - {name: get_trade_history_full, description: "TDX 历史逐笔(截止日全量)", routing: get_trade_history_full, params: [{name: code, type: str, required: true, normalize: code}, {name: before, type: str, required: false}, {name: limit, type: int, required: false}]}
  - {name: get_minute_trade_all, description: "TDX 全日分时成交汇总", routing: get_minute_trade_all, params: [{name: code, type: str, required: true, normalize: code}, {name: date, type: str, required: false}]}
  - {name: get_workday, description: "TDX 交易日查询(基准日前N天)", routing: get_workday, params: [{name: date, type: str, required: false}, {name: count, type: int, required: false}], cache_ttl_key: workday}
  - {name: get_workday_range, description: "TDX 交易日范围(起止)", routing: get_workday_range, params: [{name: start, type: str, required: false}, {name: end, type: str, required: false}], cache_ttl_key: workday}
  - {name: get_income, description: "TDX 盘后收益", routing: get_income, params: [{name: code, type: str, required: true, normalize: code}, {name: days, type: int, required: false}, {name: start_date, type: str, required: false}]}
  - {name: create_task_kline, description: "TDX 创建K线后台拉取任务", routing: create_task_kline, params: [{name: codes, type: str, required: true}, {name: start_date, type: str, required: false}, {name: tables, type: str, required: false}, {name: limit, type: int, required: false}]}
  - {name: create_task_trade, description: "TDX 创建成交后台拉取任务", routing: create_task_trade, params: [{name: code, type: str, required: true, normalize: code}, {name: start_year, type: int, required: false}, {name: end_year, type: int, required: false}]}
  - {name: get_task_list, description: "TDX 后台任务列表", routing: get_task_list, params: []}
  - {name: get_task_detail, description: "TDX 后台任务详情", routing: get_task_detail, params: [{name: id, type: str, required: true}]}
  - {name: cancel_task, description: "TDX 取消后台任务", routing: cancel_task, params: [{name: id, type: str, required: true}]}
  - {name: tdx_call, description: "TDX 通用接口调用 (透传, 高风险)", routing: tdx_call, params: [{name: path, type: str, required: true}, {name: method, type: str, required: false}, {name: query, type: str, required: false}, {name: body, type: str, required: false}, {name: raw, type: bool, required: false}], dangerous: true}

  # === TQ-Local (5) ===
  - {name: get_user_sector, description: "TQ 列出全部用户自定义板块（含 ZXG/TJG）", routing: get_user_sector, params: []}
  - {name: get_stock_list_in_sector, description: "TQ 读板块成分股（自选股 ZXG / 临时条件股 TJG 需 block_type=1）", routing: get_stock_list_in_sector, params: [{name: block_code, type: str, required: true}, {name: block_type, type: int, required: true}, {name: list_type, type: int, required: false}]}
  - {name: send_user_block, description: "TQ 向板块追加股票（高风险）", routing: send_user_block, params: [{name: block_code, type: str, required: true}, {name: stock_list, type: str, required: true}], dangerous: true}
  - {name: create_sector, description: "TQ 新建自定义板块（高风险）", routing: create_sector, params: [{name: name, type: str, required: true}, {name: block_code, type: str, required: false}], dangerous: true}
  - {name: delete_sector, description: "TQ 删除自定义板块（高风险）", routing: delete_sector, params: [{name: block_code, type: str, required: true}], dangerous: true}

  # === RHTHS a-share (21) ===
  - {name: a_share_prices_snapshot, description: "A 股全市场快照", routing: a_share_prices_snapshot, params: [{name: thscodes, type: str, required: false}, {name: limit, type: int, required: false}, {name: offset, type: int, required: false}], cache_ttl_key: realtime_quote}
  - {name: a_share_prices_historical, description: "A 股历史K线 (10年)", routing: a_share_prices_historical, params: [{name: thscode, type: str, required: true, normalize: code}, {name: start_date, type: str, required: false}, {name: end_date, type: str, required: false}, {name: adjust, type: str, required: false}], cache_ttl_key: historical}
  - {name: a_share_corporate_actions_adjustment_factors, description: "A 股复权因子", routing: a_share_corporate_actions_adjustment_factors, params: [{name: thscode, type: str, required: true, normalize: code}], cache_ttl_key: historical}
  - {name: a_share_financials_income_statements, description: "A 股利润表", routing: a_share_financials_income_statements, params: [{name: thscode, type: str, required: true, normalize: code}, {name: start, type: str, required: false}, {name: end, type: str, required: false}], cache_ttl_key: fundamentals}
  - {name: a_share_financials_balance_sheets, description: "A 股资产负债表", routing: a_share_financials_balance_sheets, params: [{name: thscode, type: str, required: true, normalize: code}, {name: start, type: str, required: false}, {name: end, type: str, required: false}], cache_ttl_key: fundamentals}
  - {name: a_share_financials_cash_flow_statements, description: "A 股现金流量表", routing: a_share_financials_cash_flow_statements, params: [{name: thscode, type: str, required: true, normalize: code}, {name: start, type: str, required: false}, {name: end, type: str, required: false}], cache_ttl_key: fundamentals}
  - {name: a_share_financials_indicators, description: "A 股财务指标", routing: a_share_financials_indicators, params: [{name: thscode, type: str, required: true, normalize: code}, {name: start, type: str, required: false}, {name: end, type: str, required: false}], cache_ttl_key: fundamentals}
  - {name: a_share_valuations_snapshot, description: "A 股估值快照", routing: a_share_valuations_snapshot, params: [{name: thscodes, type: str, required: false}], cache_ttl_key: valuation}
