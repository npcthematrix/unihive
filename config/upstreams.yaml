  # TDX 直通
  get_quote:                                  {tdx_local: get_quote}
  get_kline:                                  {tdx_local: get_kline}
  get_minute_data:                            {tdx_local: get_minute}
  get_trade:                                  {tdx_local: get_trade}
  get_stock_info:                             {tdx_local: get_stock_info}
  get_code_list:                              {tdx_local: get_code_list}
  get_batch_quote:                            {tdx_local: get_batch_quote}
  get_kline_history:                          {tdx_local: get_kline_history}
  get_kline_all:                              {tdx_local: get_kline_all}
  get_kline_all_tdx:                          {tdx_local: get_kline_all_tdx}
  get_kline_all_ths:                          {tdx_local: get_kline_all_ths}
  get_index_kline:                            {tdx_local: get_index}
  get_index_all:                              {tdx_local: get_index_all}
  get_market_count:                           {tdx_local: get_market_count}
  get_stock_codes:                            {tdx_local: get_stock_codes}
  get_etf_codes:                              {tdx_local: get_etf_codes}
  get_etf_list:                               {tdx_local: get_etf_list}
  get_trade_history:                          {tdx_local: get_trade_history}
  get_trade_history_full:                     {tdx_local: get_trade_history_full}
  get_minute_trade_all:                       {tdx_local: get_minute_trade_all}
  get_workday:                                {tdx_local: get_workday}
  get_workday_range:                          {tdx_local: get_workday_range}
  get_income:                                 {tdx_local: get_income}
  create_task_kline:                          {tdx_local: create_task_kline}
  create_task_trade:                          {tdx_local: create_task_trade}
  get_task_list:                              {tdx_local: get_task_list}
  get_task_detail:                            {tdx_local: get_task_detail}
