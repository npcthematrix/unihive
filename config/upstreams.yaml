  # === Fuyao meta (1, 另一个 search_stock 手写) ===
  - {name: meta_tickers_list, description: "【分页拉全量 ticker 列表】按 type 与 exchange 过滤，用于浏览全部可用标的。模糊搜索请用 search_stock。", routing: meta_tickers_list, params: [{name: type, type: str, required: false, enum: [a-share, a-share-index, fund-otc, fund-etf, fund-lof], description: "资产类型：a-share=A 股 / a-share-index=指数 / fund-otc=场外公募 / fund-etf=ETF / fund-lof=LOF，省略返回全部"}, {name: exchange, type: str, required: false, description: "交易所过滤：SH / SZ / BJ"}, {name: limit, type: int, required: false, description: "单页条数，最大 10000（默认 1000）"}, {name: offset, type: int, required: false, description: "分页偏移（默认 0）"}], cache_ttl_key: ticker_list, data_source_type: online}

