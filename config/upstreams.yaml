  - {name: a_share_special_data_limit_up_ladder, description: "A 股涨停天梯 (30日 6档)", routing: a_share_special_data_limit_up_ladder, params: [], cache_ttl_key: special_data, data_source_type: online}
  - {name: a_share_special_data_anomaly_analysis_stock, description: "A 股异动原因分析", routing: a_share_special_data_anomaly_analysis_stock, params: [{name: thscodes, type: str, required: true, description: "逗号分隔的 THS 代码列表，如 '600519.SH,000001.SZ'"}], cache_ttl_key: special_data, data_source_type: online}
  - {name: a_share_special_data_skyrocket_list, description: "A 股飙升榜 (火箭榜)", routing: a_share_special_data_skyrocket_list, params: [{name: period, type: str, required: false, enum: [day, hour], description: "榜单周期：day=日榜（默认）/ hour=小时榜"}], cache_ttl_key: special_data, data_source_type: online}
  - {name: a_share_special_data_hot_stock_list, description: "A 股热门股 (24h)", routing: a_share_special_data_hot_stock_list, params: [{name: period, type: str, required: false, enum: [day, hour], description: "榜单周期：day=24小时级（默认）/ hour=小时级"}], cache_ttl_key: special_data, data_source_type: online}
