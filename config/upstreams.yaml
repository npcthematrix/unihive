# UniHive MCP Gateway 配置
# 聚合多个金融数据 MCP Server
#
# Fuyao 接口参数说明：详见 docs/fuyao-api-params.md
# AI 调用前请先查阅该文档，了解各参数的含义、枚举值和约束。

upstreams:
  mootdx2:
    enabled: true
    description: "MooTDX2 行情接口"
    type: "mootdx2"
    market: "std"
    tdxdir: ""  # 通达信本地路径，空则自动探索

  tdx_quant:
    enabled: true
    description: "通达信-量化终端 (TdxQuant): 进程内直调 tqcenter.py，含 60+ 工具（行情/板块/交易日/财务/公式/交易/预警）"
    type: "tdx_quant"
    market: "std"
    tdx_root: "D:/new_tdx_mock"
    strategy_id: "unihive_gateway"
    health_check_interval_sec: 60
    call_timeout_sec: 10
    reconnect_threshold: 3
    unavailable_threshold: 10
    capabilities:
      - market_data
      - market_snapshot
      - stock_info
      - sector
      - watchlist
      - trading_calendar
      - financials
      - formula
      - trading
      - subscribe

  fuyao_ashare:
    enabled: true
    description: "同花顺-a-share-mcp: A 股行情/财报/估值/特殊数据, 28 个 gateway 工具, 端点: /mcp/a-share"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - a_share_snapshot
      - a_share_history
      - corporate_actions
      - financials_income
      - financials_balance_sheet
      - financials_cash_flow
      - financials_indicators
      - valuation_snapshot
      - calendar
      - special_data

  fuyao_index:
    enabled: true
    description: "同花顺-a-share-index-mcp: 指数/板块目录/成分股/历史K线, 7 个 gateway 工具, 端点: /mcp/a-share-index"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share-index"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - index_catalog
      - index_constituents
      - index_snapshot
      - index_history

  fuyao_meta:
    enabled: true
    description: "同花顺-meta-mcp: 跨市场 ticker 搜索/列表, 2 个 gateway 工具, 端点: /mcp/meta"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/meta"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - ticker_search
      - ticker_list

  fuyao_fund:
    enabled: true
    description: "同花顺-fund-mcp: 公募基金持仓/业绩/经理/财务/历史, 30 个 gateway 工具, 端点: /mcp/fund"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/fund"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - fund_profile
      - fund_holdings
      - fund_nav
      - fund_returns
      - fund_holders
      - fund_snapshot
      - fund_history

# 上游 tool 映射 (gateway_tool -> {upstream_name: upstream_tool_name})
# 是 routing 链之外的另一种声明方式：当某 gateway_tool 没有 routing chain，
# router 会用本段的 keys 作为 chain
upstream_tool_mapping:
  # MooTDX2 工具已移至 config/tools_mootdx2.yaml（自带 upstream_tool_mapping）
  # TdxQuant 工具移至 config/tools_tdx_quant.yaml（自带 upstream_tool_mapping）
