  fund_portfolio_bond_history:                {fuyao_fund: get_fund_portfolio_bond_history}
  fund_portfolio_bond_report_dates:           {fuyao_fund: get_fund_portfolio_bond_report_dates}
  fund_portfolio_asset_allocation:            {fuyao_fund: get_fund_portfolio_asset_allocation}

# 路由配置 (带 fallback 链的 gateway_tool)
routing: {}

# 对外暴露的工具清单
# 由 registry.py 解析后自动注册为 FastMCP tool
# MooTDX2 工具已移至 config/tools_mootdx2.yaml
# Fuyao 参数语义说明：详见 docs/fuyao-api-params.md
tools:
  # === Fuyao a-share (21) ===
  - {name: a_share_prices_snapshot, description: "A 股全市场快照", routing: a_share_prices_snapshot, params: [{name: thscodes, type: str, required: false, description: "逗号分隔的 THS 代码列表，如 '600519.SH,000001.SZ'。省略则遍历全市场分页返回。"}, {name: limit, type: int, required: false, description: "分页大小，省略 thscodes 时生效（默认 100）"}, {name: offset, type: int, required: false, description: "分页偏移，省略 thscodes 时生效（默认 0）"}], cache_ttl_key: realtime_quote}
  - {name: a_share_prices_historical, description: "A 股历史K线 (10年)", routing: a_share_prices_historical, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'，不支持逗号多标的"}, {name: start_date, type: str, required: false, description: "起始日期，格式 yyyy-MM-dd"}, {name: end_date, type: str, required: false, description: "结束日期，格式 yyyy-MM-dd"}, {name: adjust, type: str, required: false, enum: [none, forward, backward], description: "复权方式：none=不复权 / forward=前复权（默认） / backward=后复权"}], cache_ttl_key: historical}
  - {name: a_share_corporate_actions_adjustment_factors, description: "A 股复权因子", routing: a_share_corporate_actions_adjustment_factors, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'，不支持逗号多标的"}], cache_ttl_key: historical}
  - {name: a_share_financials_income_statements, description: "A 股利润表", routing: a_share_financials_income_statements, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: period, type: str, required: true, enum: [annual, quarterly], description: "报告期类型：annual=仅年报（默认）/ quarterly=每个季度末"}, {name: limit, type: int, required: false, description: "最近 N 期，范围 [1,20]，与 start/end 互斥（默认 4）"}, {name: start, type: str, required: false, description: "起始毫秒时间戳，需与 end 同传，窗口不超过 10 年"}, {name: end, type: str, required: false, description: "结束毫秒时间戳，需 >= start"}], cache_ttl_key: fundamentals}
  - {name: a_share_financials_balance_sheets, description: "A 股资产负债表", routing: a_share_financials_balance_sheets, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: period, type: str, required: true, enum: [annual, quarterly], description: "报告期类型：annual=仅年报（默认）/ quarterly=每个季度末"}, {name: limit, type: int, required: false, description: "最近 N 期，范围 [1,20]，与 start/end 互斥（默认 4）"}, {name: start, type: str, required: false, description: "起始毫秒时间戳，需与 end 同传"}, {name: end, type: str, required: false, description: "结束毫秒时间戳，需 >= start"}], cache_ttl_key: fundamentals}
  - {name: a_share_financials_cash_flow_statements, description: "A 股现金流量表", routing: a_share_financials_cash_flow_statements, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: period, type: str, required: true, enum: [annual, quarterly], description: "报告期类型：annual=仅年报（默认）/ quarterly=每个季度末"}, {name: limit, type: int, required: false, description: "最近 N 期，范围 [1,20]，与 start/end 互斥（默认 4）"}, {name: start, type: str, required: false, description: "起始毫秒时间戳，需与 end 同传"}, {name: end, type: str, required: false, description: "结束毫秒时间戳，需 >= start"}], cache_ttl_key: fundamentals}
  - {name: a_share_financials_indicators, description: "A 股财务指标", routing: a_share_financials_indicators, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: period, type: str, required: true, enum: [annual, quarterly], description: "报告期类型：annual=仅年报（默认）/ quarterly=每个季度末"}, {name: limit, type: int, required: false, description: "最近 N 期，范围 [1,20]，与 start/end 互斥（默认 4）"}, {name: start, type: str, required: false, description: "起始毫秒时间戳，需与 end 同传"}, {name: end, type: str, required: false, description: "结束毫秒时间戳，需 >= start"}], cache_ttl_key: fundamentals}
  - {name: a_share_valuations_snapshot, description: "A 股估值快照", routing: a_share_valuations_snapshot, params: [{name: thscodes, type: str, required: false, description: "逗号分隔的 THS 代码列表，如 '600519.SH,000001.SZ'"}], cache_ttl_key: valuation}
  - {name: a_share_calendar_trading_days, description: "A 股交易日历", routing: a_share_calendar_trading_days, params: [{name: date, type: str, required: false, description: "目标日期，格式 yyyy-MM-dd，省略则返回当年全部交易日"}], cache_ttl_key: workday}
  - {name: a_share_special_data_limit_up_pool, description: "A 股涨停池", routing: a_share_special_data_limit_up_pool, params: [{name: date, type: str, required: false, description: "交易日，格式 yyyy-MM-dd，省略默认当天"}, {name: page, type: int, required: false, description: "页码，从 1 开始（默认 1）"}, {name: size, type: int, required: false, description: "分页大小，范围 1~200（默认 50）"}, {name: sort_field, type: str, required: false, enum: [last_price, continue_day_cnt, seal_money, limit_up_time], description: "排序字段（默认 last_price）"}, {name: sort_dir, type: str, required: false, enum: [asc, desc], description: "排序方向：asc=升序 / desc=降序（默认 desc）"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_limit_down_pool, description: "A 股跌停池", routing: a_share_special_data_limit_down_pool, params: [{name: date, type: str, required: false, description: "交易日，格式 yyyy-MM-dd，省略默认当天"}, {name: page, type: int, required: false, description: "页码，从 1 开始（默认 1）"}, {name: size, type: int, required: false, description: "分页大小，范围 1~200（默认 50）"}, {name: sort_field, type: str, required: false, enum: [last_limit_time, first_limit_time, last_price, price_change_ratio_pct, turnover_ratio_pct], description: "排序字段（默认 last_limit_time）"}, {name: sort_dir, type: str, required: false, enum: [asc, desc], description: "排序方向（默认 desc）"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_limit_break_pool, description: "A 股炸板池", routing: a_share_special_data_limit_break_pool, params: [{name: date, type: str, required: false, description: "交易日，格式 yyyy-MM-dd，省略默认当天"}, {name: page, type: int, required: false, description: "页码，从 1 开始（默认 1）"}, {name: size, type: int, required: false, description: "分页大小，范围 1~200（默认 50）"}, {name: sort_field, type: str, required: false, enum: [price_change_ratio_pct, open_times, last_price, turnover_ratio_pct, turnover], description: "排序字段（默认 price_change_ratio_pct）"}, {name: sort_dir, type: str, required: false, enum: [asc, desc], description: "排序方向（默认 desc）"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_limit_up_ladder, description: "A 股涨停天梯 (30日 6档)", routing: a_share_special_data_limit_up_ladder, params: [], cache_ttl_key: special_data}
  - {name: a_share_special_data_anomaly_analysis_stock, description: "A 股异动原因分析", routing: a_share_special_data_anomaly_analysis_stock, params: [{name: thscodes, type: str, required: true, description: "逗号分隔的 THS 代码列表，如 '600519.SH,000001.SZ'"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_skyrocket_list, description: "A 股飙升榜 (火箭榜)", routing: a_share_special_data_skyrocket_list, params: [{name: period, type: str, required: false, enum: [day, hour], description: "榜单周期：day=日榜（默认）/ hour=小时榜"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_hot_stock_list, description: "A 股热门股 (24h)", routing: a_share_special_data_hot_stock_list, params: [{name: period, type: str, required: false, enum: [day, hour], description: "榜单周期：day=24小时级（默认）/ hour=小时级"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_hot_stock_list_history, description: "A 股热门股历史", routing: a_share_special_data_hot_stock_list_history, params: [{name: date, type: str, required: true, description: "目标日期，格式 yyyy-MM-dd，只支持一年内数据"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_hot_stock_rank_trend, description: "A 股热门股排名趋势", routing: a_share_special_data_hot_stock_rank_trend, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: start_date, type: str, required: false, description: "起始日期，格式 yyyy-MM-dd"}, {name: end_date, type: str, required: false, description: "结束日期，格式 yyyy-MM-dd，需 >= start_date"}], cache_ttl_key: special_data}
  - {name: a_share_special_data_dragon_tiger_list, description: "A 股龙虎榜", routing: a_share_special_data_dragon_tiger_list, params: [{name: board_type, type: str, required: false, enum: [all, org, hot_money], description: "榜单类型：all=全部（默认）/ org=机构榜 / hot_money=游资榜"}, {name: date, type: str, required: false, description: "目标日期，格式 yyyy-MM-dd，省略则默认最近可用交易日"}], cache_ttl_key: special_data}
  - {name: a_share_auction_snapshot, description: "A 股集合竞价快照", routing: a_share_auction_snapshot, params: [{name: thscodes, type: str, required: false, description: "逗号分隔的 THS 代码列表，省略则返回全市场"}], cache_ttl_key: special_data}
  - {name: a_share_auction_short_term_benchmark, description: "A 股短期竞价基准", routing: a_share_auction_short_term_benchmark, params: [{name: date, type: str, required: false, description: "目标日期，格式 yyyy-MM-dd，省略默认当天"}], cache_ttl_key: special_data}

  # === Fuyao a-share-index (4) ===
  - {name: a_share_index_catalog, description: "THS 指数/板块目录", routing: a_share_index_catalog, params: [{name: tag, type: str, required: false, enum: [cn_concept, region, tszs, industry], description: "板块标签：cn_concept=A 股概念（默认）/ region=区域指数 / tszs=特色指数 / industry=行业指数"}], cache_ttl_key: ticker_list}
  - {name: a_share_index_constituents, description: "指数/板块成分股", routing: a_share_index_constituents, params: [{name: thscode, type: str, required: true, description: "指数 THS 代码，如 '886042.TI'（同花顺概念）或 '000300.SH'（沪深 300）"}], cache_ttl_key: ticker_list}
  - {name: a_share_index_prices_snapshot, description: "指数行情快照", routing: a_share_index_prices_snapshot, params: [{name: thscodes, type: str, required: true, description: "逗号分隔的指数 THS 代码，如 '000001.SH,399001.SZ,886042.TI'"}], cache_ttl_key: index_data}
  - {name: a_share_index_prices_historical, description: "指数历史K线 (10年)", routing: a_share_index_prices_historical, params: [{name: thscode, type: str, required: true, description: "指数 THS 代码，如 '000300.SH'"}, {name: start_date, type: str, required: false, description: "起始日期，格式 yyyy-MM-dd"}, {name: end_date, type: str, required: false, description: "结束日期，格式 yyyy-MM-dd"}], cache_ttl_key: historical}

  # === Fuyao meta (1, 另一个 search_stock 手写) ===
