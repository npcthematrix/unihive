  get_stock_list_in_sector:                   {tdx_tq_local: get_stock_list_in_sector}
  send_user_block:                            {tdx_tq_local: send_user_block}
  create_sector:                              {tdx_tq_local: create_sector}
  delete_sector:                              {tdx_tq_local: delete_sector}

  # RHTHS a-share
  a_share_prices_snapshot:                    {rhths_ashare: get_a_share_prices_snapshot}
  a_share_prices_historical:                  {rhths_ashare: get_a_share_prices_historical}
  a_share_corporate_actions_adjustment_factors: {rhths_ashare: get_a_share_corporate_actions_adjustment_factors}
  a_share_financials_income_statements:       {rhths_ashare: get_a_share_financials_income_statements}
  a_share_financials_balance_sheets:          {rhths_ashare: get_a_share_financials_balance_sheets}
  a_share_financials_cash_flow_statements:    {rhths_ashare: get_a_share_financials_cash_flow_statements}
  a_share_financials_indicators:              {rhths_ashare: get_a_share_financials_indicators}
  a_share_valuations_snapshot:                {rhths_ashare: get_a_share_valuations_snapshot}
