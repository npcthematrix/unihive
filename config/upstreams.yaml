# UniHive MCP Gateway 配置
# 聚合多个金融数据 MCP Server
#
# Fuyao 接口参数说明：详见 docs/fuyao-api-params.md
# AI 调用前请先查阅该文档，了解各参数的含义、枚举值和约束。

upstreams:
  tdx_local:
    enabled: false
    description: "通达信-行情: 行情/K线/分时/ETF/指数, 含 1 个高风险工具 (tdx_call), 39 个 gateway 工具 (已禁用，改用 mootdx2)"
    type: "npx"
    package: "tdx-mcp-server"
    command: ["npx", "-y", "tdx-mcp-server"]
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - realtime_quote
      - kline
      - minute_bar
      - trade_detail
      - index_data
      - etf_data
      - market_stats

  mootdx2:
    enabled: true
    description: "MooTDX2 行情接口"
    type: "mootdx2"
    market: "std"

  tdx_tq_local:
    enabled: true
    description: "通达信-交易终端: 行情/自选/交易/公式系统, 含 17 个高风险工具 (write ops), 58 个 gateway 工具 (TQ-Local codegen)"
    type: "http_jsonrpc"
    base_url: "http://127.0.0.1:17709"
    timeout_seconds: 10
    retry:
      max_attempts: 2
    capabilities:
      - user_block
      - watchlist
      - conditional_stock

  fuyao_ashare:
    enabled: true
    description: "同花顺-a-share-mcp: A 股行情/财报/估值/特殊数据, 28 个 gateway 工具, 端点: /mcp/a-share"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - a_share_snapshot
      - a_share_history
      - corporate_actions
      - financials_income
      - financials_balance_sheet
      - financials_cash_flow
      - financials_indicators
      - valuation_snapshot
      - calendar
      - special_data

  fuyao_index:
    enabled: true
    description: "同花顺-a-share-index-mcp: 指数/板块目录/成分股/历史K线, 7 个 gateway 工具, 端点: /mcp/a-share-index"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share-index"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - index_catalog
      - index_constituents
      - index_snapshot
      - index_history

  fuyao_meta:
    enabled: true
    description: "同花顺-meta-mcp: 跨市场 ticker 搜索/列表, 2 个 gateway 工具, 端点: /mcp/meta"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/meta"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - ticker_search
      - ticker_list

  fuyao_fund:
    enabled: true
    description: "同花顺-fund-mcp: 公募基金持仓/业绩/经理/财务/历史, 30 个 gateway 工具, 端点: /mcp/fund"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/fund"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - fund_profile
      - fund_holdings
      - fund_nav
      - fund_returns
      - fund_holders
      - fund_snapshot
      - fund_history

  tokenwave_tdx:
    enabled: true
    description: "通达信-MooTDX: 基于 mootdx 的行情/K线/财务/板块/日历, 9 个 gateway 接口 (含 2 个 tokenwave_ 前缀命名避开 TQ-Local 冲突), local 优先 + network 兜底"
    type: "python"
    mode: "auto"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - realtime_quote
      - kline
      - minute_bar
      - financial_data
      - block_data
      - stock_info
      - trade_dates
      - etf_list

# 上游 tool 映射 (gateway_tool -> {upstream_name: upstream_tool_name})
# 是 routing 链之外的另一种声明方式：当某 gateway_tool 没有 routing chain，
# router 会用本段的 keys 作为 chain
upstream_tool_mapping:
  # TDX 直通
  get_quote:                                  {mootdx2: get_quote}
  get_kline:                                  {mootdx2: get_kline}
  get_minute_data:                            {mootdx2: get_minute}
  get_trade:                                  {mootdx2: get_trade}
  tdx_get_stock_info:                         {mootdx2: get_stock_info}
  get_code_list:                              {mootdx2: get_code_list}
  get_batch_quote:                            {mootdx2: get_batch_quote}
  get_kline_history:                          {mootdx2: get_kline_history}
  get_kline_all:                              {mootdx2: get_kline_all}
  get_kline_all_tdx:                          {mootdx2: get_kline_all_tdx}
  get_kline_all_ths:                          {mootdx2: get_kline_all_ths}
  get_index_kline:                            {mootdx2: get_index}
  get_index_all:                              {mootdx2: get_index_all}
  get_market_count:                           {mootdx2: get_market_count}
  get_stock_codes:                            {mootdx2: get_stock_codes}
  get_etf_codes:                              {mootdx2: get_etf_codes}
  get_etf_list:                               {mootdx2: get_etf_list}
  get_trade_history:                          {mootdx2: get_trade_history}
  get_trade_history_full:                     {mootdx2: get_trade_history_full}
  get_minute_trade_all:                       {mootdx2: get_minute_trade_all}
  get_workday:                                {mootdx2: get_workday}
  get_workday_range:                          {mootdx2: get_workday_range}
  get_income:                                 {mootdx2: get_income}
  create_task_kline:                          {mootdx2: create_task_kline}
  create_task_trade:                          {mootdx2: create_task_trade}
  get_task_list:                              {mootdx2: get_task_list}
  get_task_detail:                            {mootdx2: get_task_detail}
  cancel_task:                                {mootdx2: cancel_task}
  tdx_call:                                   {mootdx2: tdx_call}
  search_stock:
    fuyao_meta: get_meta_tickers_search       # HTTP, 可缓存 (缓存策略见 gateway._is_fuyao_source)
    tdx_local: search_stock                   # 本地兜底, 不缓存
  get_market_stats:                          {mootdx2: get_market_stats}
  get_health:                                {mootdx2: get_health}
  get_server_status:                         {mootdx2: get_server_status}

  # TQ-Local (通达信本地 HTTP JSON-RPC, 端口 17709)
  # 工具与路由均由 config/tools_tdx_tq_local.yaml 自带 upstream_tool_mapping 提供,
  # 这里不再重复声明, 避免与 codegen 产物重名互相覆盖。

  # Fuyao a-share
  a_share_prices_snapshot:                    {fuyao_ashare: get_a_share_prices_snapshot}
  a_share_prices_historical:                  {fuyao_ashare: get_a_share_prices_historical}
  a_share_corporate_actions_adjustment_factors: {fuyao_ashare: get_a_share_corporate_actions_adjustment_factors}
  a_share_financials_income_statements:       {fuyao_ashare: get_a_share_financials_income_statements}
  a_share_financials_balance_sheets:          {fuyao_ashare: get_a_share_financials_balance_sheets}
  a_share_financials_cash_flow_statements:    {fuyao_ashare: get_a_share_financials_cash_flow_statements}
  a_share_financials_indicators:              {fuyao_ashare: get_a_share_financials_indicators}
  a_share_valuations_snapshot:                {fuyao_ashare: get_a_share_valuations_snapshot}
  a_share_calendar_trading_days:              {fuyao_ashare: get_a_share_calendar_trading_days}
  a_share_special_data_limit_up_pool:         {fuyao_ashare: get_a_share_special_data_limit_up_pool}
  a_share_special_data_limit_down_pool:       {fuyao_ashare: get_a_share_special_data_limit_down_pool}
  a_share_special_data_limit_break_pool:      {fuyao_ashare: get_a_share_special_data_limit_break_pool}
  a_share_special_data_limit_up_ladder:       {fuyao_ashare: get_a_share_special_data_limit_up_ladder}
  a_share_special_data_anomaly_analysis_stock: {fuyao_ashare: get_a_share_special_data_anomaly_analysis_stock}
  a_share_special_data_skyrocket_list:        {fuyao_ashare: get_a_share_special_data_skyrocket_list}
  a_share_special_data_hot_stock_list:        {fuyao_ashare: get_a_share_special_data_hot_stock_list}
  a_share_special_data_hot_stock_list_history: {fuyao_ashare: get_a_share_special_data_hot_stock_list_history}
  a_share_special_data_hot_stock_rank_trend:  {fuyao_ashare: get_a_share_special_data_hot_stock_rank_trend}
  a_share_special_data_dragon_tiger_list:     {fuyao_ashare: get_a_share_special_data_dragon_tiger_list}
  a_share_auction_snapshot:                   {fuyao_ashare: get_a_share_auction_snapshot}
  a_share_auction_short_term_benchmark:       {fuyao_ashare: get_a_share_auction_short_term_benchmark}

  # Fuyao a-share-index
  a_share_index_catalog:                      {fuyao_index: get_a_share_index_catalog_ths_index_list}
  a_share_index_constituents:                 {fuyao_index: get_a_share_index_constituents_ths_stock_list}
  a_share_index_prices_snapshot:              {fuyao_index: get_a_share_index_prices_snapshot}
  a_share_index_prices_historical:            {fuyao_index: get_a_share_index_prices_historical}

  # Fuyao meta
  meta_tickers_list:                          {fuyao_meta: get_meta_tickers_list}

  # Fuyao fund
  fund_profile_detail:                        {fuyao_fund: get_fund_profile_detail}
  fund_portfolio_holdings:                    {fuyao_fund: get_fund_portfolio_holdings}
  fund_performance_returns:                   {fuyao_fund: get_fund_performance_returns}
  fund_holders_detail:                        {fuyao_fund: get_fund_holders_detail}
  fund_market_historical:                     {fuyao_fund: get_fund_market_historical}
  fund_market_snapshot:                        {fuyao_fund: get_fund_market_snapshot}
  fund_companies_detail:                      {fuyao_fund: get_fund_companies_detail}
  fund_portfolio_industry_allocation:         {fuyao_fund: get_fund_portfolio_industry_allocation}
  fund_performance_indicators_historical:     {fuyao_fund: get_fund_performance_indicators_historical}
  fund_performance_drawdowns:                 {fuyao_fund: get_fund_performance_drawdowns}
  fund_holders_top:                           {fuyao_fund: get_fund_holders_top}
  fund_corporate_actions_dividends:           {fuyao_fund: get_fund_corporate_actions_dividends}
  fund_diagnostics_detail:                    {fuyao_fund: get_fund_diagnostics_detail}
  fund_financials_indicators:                 {fuyao_fund: get_fund_financials_indicators}
  fund_financials_income_statements:          {fuyao_fund: get_fund_financials_income_statements}
  fund_financials_balance_sheets:             {fuyao_fund: get_fund_financials_balance_sheets}
  fund_managers_investment_style:             {fuyao_fund: get_fund_managers_investment_style}
  fund_managers_performance:                  {fuyao_fund: get_fund_managers_performance}
  fund_managers_experience:                   {fuyao_fund: get_fund_managers_experience}
  fund_managers_detail:                       {fuyao_fund: get_fund_managers_detail}
  fund_news_article_list:                     {fuyao_fund: get_fund_news_article_list}
  fund_offerings_list:                        {fuyao_fund: get_fund_offerings_list}
  fund_portfolio_stock_history:               {fuyao_fund: get_fund_portfolio_stock_history}
  fund_portfolio_stock_report_dates:          {fuyao_fund: get_fund_portfolio_stock_report_dates}
  fund_portfolio_bond_history:                {fuyao_fund: get_fund_portfolio_bond_history}
  fund_portfolio_bond_report_dates:           {fuyao_fund: get_fund_portfolio_bond_report_dates}
  fund_portfolio_asset_allocation:            {fuyao_fund: get_fund_portfolio_asset_allocation}

  # MooTDX 工具 (moo 前缀避免与其他上游同名工具冲突)
  moo_realtime_quote:
    tokenwave_tdx: get_realtime_quote
  moo_kline:
    tokenwave_tdx: get_kline
  moo_minute_bar:
    tokenwave_tdx: get_minute_bar
  moo_daily_bar:
    tokenwave_tdx: get_daily_bar
  moo_get_financial_data:
    tokenwave_tdx: get_financial_data
  moo_block_data:
    tokenwave_tdx: get_block_data
  moo_get_stock_info:
    tokenwave_tdx: get_stock_info
  moo_trade_dates:
    tokenwave_tdx: get_trade_dates
  moo_etf_list:
    tokenwave_tdx: get_etf_list

# 路由配置 (带 fallback 链的 gateway_tool)
routing:
  moo_realtime_quote:
    chain: ["tokenwave_tdx"]
    description: "实时行情"
  moo_daily_bar:
    chain: ["tokenwave_tdx"]
    description: "日K线行情"
  moo_minute_bar:
    chain: ["tokenwave_tdx"]
    description: "分钟K线行情"
  moo_kline:
    chain: ["tokenwave_tdx"]
    description: "K线"

# 对外暴露的工具清单
# 由 registry.py 解析后自动注册为 FastMCP tool
# Fuyao 参数语义说明：详见 docs/fuyao-api-params.md
tools:
  # === TDX 直通 (30) ===
  - {name: get_quote, description: "TDX 实时行情", routing: get_quote, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}]}
  - {name: get_kline, description: "K线 (tokenwave_tdx only, day/week/month/minute1/5/15/30/60)", routing: get_kline, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型：day=日K / week=周K / month=月K / minute1=1分钟 / minute5=5分钟 / minute15=15分钟 / minute30=30分钟 / minute60=60分钟（默认 day）"}, {name: limit, type: int, required: false, description: "返回根数（默认 100）"}]}
  - {name: get_minute_data, description: "TDX 今日分时(240 根)", routing: get_minute_data, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}]}
  - {name: get_trade, description: "TDX 逐笔成交", routing: get_trade, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}]}
  - {name: tdx_get_stock_info, description: "TDX 单只股票综合信息 (行情服务; 交易终端的同名工具见 get_stock_info)", routing: tdx_get_stock_info, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}]}
  - {name: get_code_list, description: "TDX 全量代码列表 (sh/sz/bj)", routing: get_code_list, params: [{name: exchange, type: str, required: false, enum: [sh, sz, bj], description: "交易所：sh=上海 / sz=深圳 / bj=北京（省略则返回全部）"}]}
  - {name: get_batch_quote, description: "TDX 批量行情", routing: get_batch_quote, params: [{name: codes, type: str, required: true, description: "逗号分隔的股票代码，如 '600000,000001'"}]}
  - {name: get_kline_history, description: "TDX 历史K线(指定区间)", routing: get_kline_history, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型（默认 day）"}, {name: limit, type: int, required: false, description: "返回根数"}]}
  - {name: get_kline_all, description: "TDX 全量K线(全历史)", routing: get_kline_all, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型（默认 day）"}, {name: limit, type: int, required: false, description: "返回根数"}]}
  - {name: get_kline_all_tdx, description: "TDX 全量K线 (TDX 源)", routing: get_kline_all_tdx, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型（默认 day）"}, {name: limit, type: int, required: false, description: "返回根数"}]}
  - {name: get_kline_all_ths, description: "TDX 全量K线 (同花顺源, 前复权)", routing: get_kline_all_ths, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码，如 '600000' 或 'sh600000'"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型（默认 day）"}, {name: limit, type: int, required: false, description: "返回根数"}]}
  - {name: get_index_kline, description: "TDX 指数K线", routing: get_index_kline, params: [{name: code, type: str, required: true, description: "指数代码，如 '000001'（上证指数）或 '399001'（深证成指）"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型（默认 day）"}]}
  - {name: get_index_all, description: "TDX 全指K线(含成分股)", routing: get_index_all, params: [{name: code, type: str, required: true, description: "指数代码"}, {name: type, type: str, required: false, enum: [day, week, month, minute1, minute5, minute15, minute30, minute60], description: "K线类型（默认 day）"}, {name: limit, type: int, required: false, description: "返回根数"}]}
  - {name: get_market_count, description: "TDX 市场证券数量统计", routing: get_market_count, params: []}
  - {name: get_stock_codes, description: "TDX 代码列表(分页)", routing: get_stock_codes, params: [{name: limit, type: int, required: false, description: "返回数量"}, {name: prefix, type: bool, required: false, description: "是否带前缀"}]}
  - {name: get_etf_codes, description: "TDX ETF 代码列表", routing: get_etf_codes, params: [{name: limit, type: int, required: false, description: "返回数量"}, {name: prefix, type: bool, required: false, description: "是否带前缀"}]}
  - {name: get_etf_list, description: "ETF 列表 (tokenwave_tdx 优先 + tdx_local 兜底)", routing: get_etf_list, params: [{name: exchange, type: str, required: false, description: "交易所过滤"}, {name: limit, type: int, required: false, description: "返回数量"}]}
  - {name: get_trade_history, description: "TDX 历史逐笔(分页)", routing: get_trade_history, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码"}, {name: date, type: str, required: false, description: "日期 YYYYMMDD"}, {name: start, type: int, required: false, description: "起始偏移"}, {name: count, type: int, required: false, description: "返回条数"}]}
  - {name: get_trade_history_full, description: "TDX 历史逐笔(截止日全量)", routing: get_trade_history_full, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码"}, {name: before, type: str, required: false, description: "截止日期 YYYYMMDD"}, {name: limit, type: int, required: false, description: "返回条数"}]}
  - {name: get_minute_trade_all, description: "TDX 全日分时成交汇总", routing: get_minute_trade_all, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码"}, {name: date, type: str, required: false, description: "日期 YYYYMMDD"}]}
  - {name: get_workday, description: "TDX 交易日查询(基准日前N天)", routing: get_workday, params: [{name: date, type: str, required: false, description: "基准日期 YYYYMMDD"}, {name: count, type: int, required: false, description: "往前查N天"}]}
  - {name: get_workday_range, description: "TDX 交易日范围(起止)", routing: get_workday_range, params: [{name: start, type: str, required: false, description: "起始日期 YYYYMMDD"}, {name: end, type: str, required: false, description: "结束日期 YYYYMMDD"}]}
  - {name: get_income, description: "TDX 盘后收益", routing: get_income, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码"}, {name: days, type: int, required: false, description: "天数"}, {name: start_date, type: str, required: false, description: "起始日期 YYYYMMDD"}]}
  - {name: create_task_kline, description: "TDX 创建K线后台拉取任务", routing: create_task_kline, params: [{name: codes, type: str, required: true, description: "逗号分隔的股票代码"}, {name: start_date, type: str, required: false, description: "起始日期 YYYYMMDD"}, {name: tables, type: str, required: false, description: "表名"}, {name: limit, type: int, required: false, description: "返回条数"}]}
  - {name: create_task_trade, description: "TDX 创建成交后台拉取任务", routing: create_task_trade, params: [{name: code, type: str, required: true, normalize: code, description: "股票代码"}, {name: start_year, type: int, required: false, description: "起始年份"}, {name: end_year, type: int, required: false, description: "结束年份"}]}
  - {name: get_task_list, description: "TDX 后台任务列表", routing: get_task_list, params: []}
  - {name: get_task_detail, description: "TDX 后台任务详情", routing: get_task_detail, params: [{name: id, type: str, required: true, description: "任务ID"}]}
  - {name: cancel_task, description: "TDX 取消后台任务", routing: cancel_task, params: [{name: id, type: str, required: true, description: "任务ID"}]}
