# UniHive MCP Gateway 配置
# 聚合多个金融数据 MCP Server

# 缓存策略：只缓存"远程 HTTP 同花顺源(fuyao_*)"的非实时响应。
#   - 实时行情(realtime_quote) 不缓存：行情要最新，且本地终端获取已足够快。
#   - 本地终端/本地库(mootdx2 / tdx_quant / thsdk / omni) 一律不缓存：
#     本地数据访问再套一层缓存纯属多余。
#   - 未在此配置 TTL 的 ttl_key 同样视为不缓存。
# 仅当工具路由候选链上含 fuyao_* 源、且本次实际命中 fuyao 时才读写缓存。
cache:
  enabled: true
  db_path: logs/cache.db
  max_entries: 50000
  operation_timeout: 3.0
  ttl:
    # realtime_quote: 故意不配置 —— 实时行情不缓存
    historical: 86400        # 历史K线/复权因子等（收盘后不变），缓存 1 天
    fundamentals: 86400      # 财报三表/财务指标，缓存 1 天
    valuation: 30            # 估值快照，30s（兼顾新鲜度与上游削峰）
    special_data: 300        # 涨停池/异动等特色数据，5 分钟
    ticker_list: 3600        # 证券代码/板块列表，1 小时
    workday: 604800          # 交易日历，7 天
    search: 60               # 证券搜索，1 分钟

upstreams:
  mootdx2:
    enabled: true
    description: "MooTDX2 行情接口"
    type: "mootdx2"
    market: "std"
    tdxdir: "D:/new_tdx_mock"  # 通达信本地路径，空则自动探索
    # 固定行情服务器列表（按顺序连接 + 故障转移）。
    # - 配置后只连这些 IP，不再跑 mootdx2 bestip 全网测速选优；首台作为启动
    #   连接目标，其余作为运行期 failover 候选（连续失败自动切换）。
    # - 只接受 IP 字面量（mootdx2 内部 ipaddress 校验），不支持域名；
    #   端口为通达信标准 7709。
    # - 留空/删除本段则保持原行为：bestip=True 自动测速选最优服务器。
    servers:
      - host: "101.33.225.16"
        port: 7709
      - host: "81.71.32.47"
        port: 7709
    capabilities:
      - market_data
      - realtime_quote
      - daily_bar
      - minute_bar
      - stock_info
      - index_data

  tdx_quant:
    enabled: true
    description: "通达信-量化终端 (TdxQuant): 进程内直调 tqcenter.py，含 60+ 工具（行情/板块/交易日/财务/公式/交易/预警）"
    type: "tdx_quant"
    market: "std"
    tdx_root: "D:/new_tdx_mock"
    tdx_remote_port: 17709
    strategy_id: "unihive_gateway"
    health_check_interval_sec: 60
    call_timeout_sec: 10
    reconnect_threshold: 3
    unavailable_threshold: 10
    capabilities:
      - market_data
      - market_snapshot
      - stock_info
      - sector
      - watchlist
      - trading_calendar
      - financials
      - formula
      - trading
      - subscribe

  fuyao_ashare:
    enabled: true
    description: "同花顺-a-share-mcp: A 股行情/财报/估值/特殊数据, 28 个 gateway 工具, 端点: /mcp/a-share"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share"
    api_key: "${FUYAO_API_KEY}"
    timeout_seconds: 15
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - a_share_snapshot
      - a_share_history
      - corporate_actions
      - financials_income
      - financials_balance_sheet
      - financials_cash_flow
      - financials_indicators
      - valuation_snapshot
      - calendar
      - special_data

  fuyao_index:
    enabled: true
    description: "同花顺-a-share-index-mcp: 指数/板块目录/成分股/历史K线, 7 个 gateway 工具, 端点: /mcp/a-share-index"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share-index"
    api_key: "${FUYAO_API_KEY}"
    timeout_seconds: 10
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - index_catalog
      - index_constituents
      - index_snapshot
      - index_history

  fuyao_meta:
    enabled: true
    description: "同花顺-meta-mcp: 跨市场 ticker 搜索/列表, 2 个 gateway 工具, 端点: /mcp/meta"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/meta"
    api_key: "${FUYAO_API_KEY}"
    timeout_seconds: 10
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - ticker_search
      - ticker_list

  fuyao_fund:
    enabled: true
    description: "同花顺-fund-mcp: 公募基金持仓/业绩/经理/财务/历史, 30 个 gateway 工具, 端点: /mcp/fund"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/fund"
    api_key: "${FUYAO_API_KEY}"
    timeout_seconds: 20
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - fund_profile
      - fund_holdings
      - fund_nav
      - fund_returns
      - fund_holders
      - fund_snapshot
      - fund_history

  omni:
    enabled: true
    description: "OMNIDATA 板块数据: 从 SQLite 读取行业/概念板块数据，需先运行同步脚本"
    type: "omni"
    db_path: "./data/board.db"
    capabilities:
      - board_data

  thsdk:
    enabled: true
    description: "同花顺 thsdk (社区 panghu11033/thsdk 包): 游客/账号登录, 16 只读工具常驻；自选写工具仅 ALLOW_WATCHLIST_WRITE=true 时注册"
    type: "thsdk"
    call_timeout_sec: 30
    throttle_ms: 60
    capabilities:
      - market_data
      - realtime_quote
      - daily_bar
      - tick
      - wencai
      - news
      - watchlist

  THS-LOCAL-GATEWAY:
    enabled: true
    type: "ths_local_gateway"
    base_url: "http://127.0.0.1:17281/mcp"
    description: "FQGate 本地 MCP 网关"
    timeout_seconds: 30
    connect_timeout_seconds: 5.0

# Gateway 全局性能配置
gateway:
  per_upstream_timeout: 10  # 单个上游调用超时，防止卡死 fallback 链

