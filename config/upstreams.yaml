  - {name: a_share_calendar_trading_days, description: "A 股交易日历", routing: a_share_calendar_trading_days, params: [{name: date, type: str, required: false, description: "目标日期，格式 yyyy-MM-dd，省略则返回当年全部交易日"}], cache_ttl_key: workday, data_source_type: online}
  - {name: a_share_special_data_limit_up_pool, description: "A 股涨停池", routing: a_share_special_data_limit_up_pool, params: [{name: date, type: str, required: false, description: "交易日，格式 yyyy-MM-dd，省略默认当天"}, {name: page, type: int, required: false, description: "页码，从 1 开始（默认 1）"}, {name: size, type: int, required: false, description: "分页大小，范围 1~200（默认 50）"}, {name: sort_field, type: str, required: false, enum: [last_price, continue_day_cnt, seal_money, limit_up_time], description: "排序字段（默认 last_price）"}, {name: sort_dir, type: str, required: false, enum: [asc, desc], description: "排序方向：asc=升序 / desc=降序（默认 desc）"}], cache_ttl_key: special_data, data_source_type: online}
  - {name: a_share_special_data_limit_down_pool, description: "A 股跌停池", routing: a_share_special_data_limit_down_pool, params: [{name: date, type: str, required: false, description: "交易日，格式 yyyy-MM-dd，省略默认当天"}, {name: page, type: int, required: false, description: "页码，从 1 开始（默认 1）"}, {name: size, type: int, required: false, description: "分页大小，范围 1~200（默认 50）"}, {name: sort_field, type: str, required: false, enum: [last_limit_time, first_limit_time, last_price, price_change_ratio_pct, turnover_ratio_pct], description: "排序字段（默认 last_limit_time）"}, {name: sort_dir, type: str, required: false, enum: [asc, desc], description: "排序方向（默认 desc）"}], cache_ttl_key: special_data, data_source_type: online}
