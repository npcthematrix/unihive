  a_share_prices_snapshot:                    {fuyao_ashare: get_a_share_prices_snapshot}
  a_share_prices_historical:                  {fuyao_ashare: get_a_share_prices_historical}
  a_share_corporate_actions_adjustment_factors: {fuyao_ashare: get_a_share_corporate_actions_adjustment_factors}
  a_share_financials_income_statements:       {fuyao_ashare: get_a_share_financials_income_statements}
  a_share_financials_balance_sheets:          {fuyao_ashare: get_a_share_financials_balance_sheets}
  a_share_financials_cash_flow_statements:    {fuyao_ashare: get_a_share_financials_cash_flow_statements}
  a_share_financials_indicators:              {fuyao_ashare: get_a_share_financials_indicators}
  a_share_valuations_snapshot:                {fuyao_ashare: get_a_share_valuations_snapshot}
  a_share_calendar_trading_days:              {fuyao_ashare: get_a_share_calendar_trading_days}
  a_share_special_data_limit_up_pool:         {fuyao_ashare: get_a_share_special_data_limit_up_pool}
  a_share_special_data_limit_down_pool:       {fuyao_ashare: get_a_share_special_data_limit_down_pool}
  a_share_special_data_limit_break_pool:      {fuyao_ashare: get_a_share_special_data_limit_break_pool}
  a_share_special_data_limit_up_ladder:       {fuyao_ashare: get_a_share_special_data_limit_up_ladder}
  a_share_special_data_anomaly_analysis_stock: {fuyao_ashare: get_a_share_special_data_anomaly_analysis_stock}
  a_share_special_data_skyrocket_list:        {fuyao_ashare: get_a_share_special_data_skyrocket_list}
  a_share_special_data_hot_stock_list:        {fuyao_ashare: get_a_share_special_data_hot_stock_list}
  a_share_special_data_hot_stock_list_history: {fuyao_ashare: get_a_share_special_data_hot_stock_list_history}
  a_share_special_data_hot_stock_rank_trend:  {fuyao_ashare: get_a_share_special_data_hot_stock_rank_trend}
  a_share_special_data_dragon_tiger_list:     {fuyao_ashare: get_a_share_special_data_dragon_tiger_list}
  a_share_auction_snapshot:                   {fuyao_ashare: get_a_share_auction_snapshot}
  a_share_auction_short_term_benchmark:       {fuyao_ashare: get_a_share_auction_short_term_benchmark}

  # Fuyao a-share-index
  a_share_index_catalog:                      {fuyao_index: get_a_share_index_catalog_ths_index_list}
  a_share_index_constituents:                 {fuyao_index: get_a_share_index_constituents_ths_stock_list}
  a_share_index_prices_snapshot:              {fuyao_index: get_a_share_index_prices_snapshot}
  a_share_index_prices_historical:            {fuyao_index: get_a_share_index_prices_historical}

  # Fuyao meta
  meta_tickers_list:                          {fuyao_meta: get_meta_tickers_list}

  # Fuyao fund
  fund_profile_detail:                        {fuyao_fund: get_fund_profile_detail}
  fund_portfolio_holdings:                    {fuyao_fund: get_fund_portfolio_holdings}
  fund_performance_returns:                   {fuyao_fund: get_fund_performance_returns}
  fund_holders_detail:                        {fuyao_fund: get_fund_holders_detail}
  fund_market_historical:                     {fuyao_fund: get_fund_market_historical}
  fund_market_snapshot:                        {fuyao_fund: get_fund_market_snapshot}
  fund_companies_detail:                      {fuyao_fund: get_fund_companies_detail}
  fund_portfolio_industry_allocation:         {fuyao_fund: get_fund_portfolio_industry_allocation}
  fund_performance_indicators_historical:     {fuyao_fund: get_fund_performance_indicators_historical}
