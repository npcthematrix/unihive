  # RHTHS fund
  fund_profile_detail:                        {rhths_fund: get_fund_profile_detail}
  fund_portfolio_holdings:                    {rhths_fund: get_fund_portfolio_holdings}
  fund_performance_returns:                   {rhths_fund: get_fund_performance_returns}
  fund_holders_detail:                        {rhths_fund: get_fund_holders_detail}
  fund_market_historical:                     {rhths_fund: get_fund_market_historical}
  fund_companies_detail:                      {rhths_fund: get_fund_companies_detail}
  fund_portfolio_industry_allocation:         {rhths_fund: get_fund_portfolio_industry_allocation}
