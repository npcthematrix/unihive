  - {name: a_share_corporate_actions_adjustment_factors, description: "A 股复权因子", routing: a_share_corporate_actions_adjustment_factors, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'，不支持逗号多标的"}], cache_ttl_key: historical, data_source_type: online}
