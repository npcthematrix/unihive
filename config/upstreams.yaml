# 全局开关
disable_dangerous: false
strict_registry: true

# 缓存配置
cache:
  enabled: true
  db_path: "logs/cache.db"

  ttl:
    realtime_quote: 10
    minute_bar: 60
    daily_bar: 300
    index_data: 60
    fundamentals: 3600
    announcement: 1800
    fund_data: 300
    market_stats: 30
    search: 300
    special_data: 60
    valuation: 300
    fund_holdings: 3600
    fund_history: 3600
    ticker_list: 3600
    workday: 86400
    etf_list: 3600
    historical: 3600

# 日志配置
logging:
  level: "INFO"
  format: "json"
  path: "logs"
  rotation:
    max_bytes: 10485760
    backup_count: 5
