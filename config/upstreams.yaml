# UniHive MCP Gateway 配置
# 聚合多个金融数据 MCP Server

upstreams:
  tdx_local:
    enabled: true
    type: "npx"
    package: "tdx-mcp-server"
    command: ["npx", "-y", "tdx-mcp-server"]
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - realtime_quote
      - kline
      - minute_bar
      - trade_detail
      - index_data
      - etf_data
      - market_stats

  tdx_tq_local:
    enabled: true
    type: "http_jsonrpc"
    base_url: "http://127.0.0.1:17709"
    timeout_seconds: 10
    retry:
      max_attempts: 2
    capabilities:
      - user_block
      - watchlist
      - conditional_stock

  rhths_ashare:
    enabled: true
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - a_share_snapshot
      - a_share_history
      - corporate_actions
      - financials_income
      - financials_balance_sheet
      - financials_cash_flow
      - financials_indicators
      - valuation_snapshot
      - calendar
      - special_data

  rhths_index:
    enabled: true
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share-index"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - index_catalog
      - index_constituents
      - index_snapshot
      - index_history

  rhths_meta:
    enabled: true
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/meta"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - ticker_search
      - ticker_list

  rhths_fund:
    enabled: true
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/fund"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    capabilities:
      - fund_profile
      - fund_holdings
      - fund_nav
      - fund_returns
      - fund_holders
      - fund_snapshot
      - fund_history

  tushare:
    enabled: true
    type: "npx"
    package: "@tushare/mcp"
    command: ["npx", "-y", "@tushare/mcp"]
    env:
      TUSHARE_TOKEN: "${TUSHARE_TOKEN}"
    timeout_seconds: 60
    retry:
      max_attempts: 2
      backoff_base: 3
    capabilities:
      - fundamentals
      - announcement

