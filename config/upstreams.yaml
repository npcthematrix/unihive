  - {name: a_share_financials_indicators, description: "A 股财务指标", routing: a_share_financials_indicators, params: [{name: thscode, type: str, required: true, normalize: code, description: "THS 代码，如 '600519.SH'"}, {name: period, type: str, required: true, enum: [annual, quarterly], description: "报告期类型：annual=仅年报（默认）/ quarterly=每个季度末"}, {name: limit, type: int, required: false, description: "最近 N 期，范围 [1,20]，与 start/end 互斥（默认 4）"}, {name: start, type: str, required: false, description: "起始毫秒时间戳，需与 end 同传"}, {name: end, type: str, required: false, description: "结束毫秒时间戳，需 >= start"}], cache_ttl_key: fundamentals, data_source_type: online}
