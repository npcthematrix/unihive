  a_share_special_data_limit_break_pool:      {rhths_ashare: get_a_share_special_data_limit_break_pool}
  a_share_special_data_limit_up_ladder:       {rhths_ashare: get_a_share_special_data_limit_up_ladder}
  a_share_special_data_anomaly_analysis_stock: {rhths_ashare: get_a_share_special_data_anomaly_analysis_stock}
  a_share_special_data_skyrocket_list:        {rhths_ashare: get_a_share_special_data_skyrocket_list}
  a_share_special_data_hot_stock_list:        {rhths_ashare: get_a_share_special_data_hot_stock_list}
