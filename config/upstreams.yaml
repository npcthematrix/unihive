  # === Fuyao a-share-index (4) ===
  - {name: a_share_index_catalog, description: "THS 指数/板块目录", routing: a_share_index_catalog, params: [{name: tag, type: str, required: false, enum: [cn_concept, region, tszs, industry], description: "板块标签：cn_concept=A 股概念（默认）/ region=区域指数 / tszs=特色指数 / industry=行业指数"}], cache_ttl_key: ticker_list, data_source_type: online}
