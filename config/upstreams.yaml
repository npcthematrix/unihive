# UniHive MCP Gateway 配置
# 聚合多个金融数据 MCP Server
#
# Fuyao 接口参数说明：详见 docs/fuyao-api-params.md
# AI 调用前请先查阅该文档，了解各参数的含义、枚举值和约束。

upstreams:
  mootdx2:
    enabled: true
    description: "MooTDX2 行情接口"
    type: "mootdx2"
    market: "std"
    tdxdir: ""  # 通达信本地路径，空则自动探索
    description: "通达信-量化终端 (TdxQuant): 进程内直调 tqcenter.py，含 60+ 工具（行情/板块/交易日/财务/公式/交易/预警）"
    type: "tdx_quant"
    market: "std"
    tdx_root: "D:/new_tdx_mock"
    strategy_id: "unihive_gateway"
    health_check_interval_sec: 60
    call_timeout_sec: 10
    reconnect_threshold: 3
    unavailable_threshold: 10
    description: "同花顺-a-share-mcp: A 股行情/财报/估值/特殊数据, 28 个 gateway 工具, 端点: /mcp/a-share"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    description: "同花顺-a-share-index-mcp: 指数/板块目录/成分股/历史K线, 7 个 gateway 工具, 端点: /mcp/a-share-index"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/a-share-index"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    description: "同花顺-meta-mcp: 跨市场 ticker 搜索/列表, 2 个 gateway 工具, 端点: /mcp/meta"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/meta"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
    description: "同花顺-fund-mcp: 公募基金持仓/业绩/经理/财务/历史, 30 个 gateway 工具, 端点: /mcp/fund"
    type: "http"
    base_url: "https://fuyao.aicubes.cn/mcp/fund"
    api_key: "${RHTHS_API_KEY}"
    timeout_seconds: 30
    retry:
      max_attempts: 3
      backoff_base: 2
