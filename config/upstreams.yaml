  a_share_special_data_dragon_tiger_list:     {rhths_ashare: get_a_share_special_data_dragon_tiger_list}
  a_share_auction_snapshot:                   {rhths_ashare: get_a_share_auction_snapshot}
  a_share_auction_short_term_benchmark:       {rhths_ashare: get_a_share_auction_short_term_benchmark}

  # RHTHS a-share-index
  a_share_index_catalog:                      {rhths_index: get_a_share_index_catalog_ths_index_list}
  a_share_index_constituents:                 {rhths_index: get_a_share_index_constituents_ths_stock_list}
  a_share_index_prices_snapshot:              {rhths_index: get_a_share_index_prices_snapshot}
