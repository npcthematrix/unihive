# OMNIDATA 板块数据 MCP 工具定义（文件头注释仅供开发者，不会发布到 MCP schema）
#
# 内部实现说明（勿写进对外 description）:
#   数据落本地 SQLite (data/board.db) 的 SECTORS 表，source 列只有 THS / TDX:
#   THS — 用同花顺 fuyao 上游服务同步；TDX — 用通达信 tqquant(tqcenter) 上游服务同步。
#   fuyao / tqquant 只是同步时选用的上游服务名，不是查询接口的 source 取值。
#
# board_type: industry(行业) / concept(概念) / region(地域) / style(风格)
#   - THS 仅有 industry / concept
#   - TDX  覆盖 industry / concept / region / style
# 板块代码格式: THS 为 6 位数字 (881xxx 行业 / 885xxx 概念)；
#   TDX 带交易所后缀 (880xxx.SH 概念/地域/风格、881xxx.SH 行业)

tools:
  - name: omni_list_sectors
    description: |-
      【板块列表】查询板块清单（行业/概念/地域/风格板块）。

      【使用场景】
      - 用户问"有哪些行业板块/概念板块"时调用
      - 板块热点追踪前置步骤

      【参数说明】
      - source (可选): 数据来源，THS=同花顺 / TDX=通达信；省略缺省为 TDX（仅返回通达信板块）。如需同花顺板块请显式传 THS，如需两家全部请传 all
      - board_type (可选): 板块类型，industry(行业) / concept(概念) / region(地域) / style(风格)；省略表示全部。注意同花顺(THS)只有行业/概念，地域/风格仅通达信(TDX)提供
      - keyword (可选): 模糊搜索关键词，同时匹配板块名称和代码

      【返回字段】data 为数组，每项: id, source(THS/TDX), board_type, code, name, stock_count(成分股数量)

      【返回示例】
      成功: {"success": true, "data": [{"id": 1, "source": "THS", "board_type": "concept", "code": "885756", "name": "芯片概念", "stock_count": 923}], "error": null, "source": "omni", "hops": []}
      空数据: {"success": true, "data": [], ...}
    routing: omni_list_sectors
    upstream_tool_mapping:
      omni: omni_list_sectors
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: source
        type: str
        required: false
        enum: ["TDX", "THS", "all"]
        description: 数据来源，TDX=通达信(缺省) / THS=同花顺 / all=两家全部；省略等价于 TDX
      - name: board_type
        type: str
        required: false
        enum: ["industry", "concept", "region", "style", "all"]
        description: 板块类型 industry/concept/region/style/all(缺省)；region、style 仅 TDX 有
      - name: keyword
        type: str
        required: false
        description: 模糊搜索关键词（匹配板块名称或代码）

  - name: omni_get_sector_stocks
    description: |-
      【板块成分股】查询指定板块包含的所有成分股（按 rank 升序）。

      【使用场景】
      - 用户问"芯片概念有哪些股票"时调用
      - 板块内股票筛选、批量行情前置步骤

      【参数说明】
      - sector_code (可选): 板块代码。同花顺(THS)为 6 位数字（如 '885756' 芯片概念、'881101'）；通达信(TDX)标准格式带 .SH 后缀（如 '880569.SH'），传 6 位数字省略后缀也会自动识别为 TDX
      - sector_name (可选): 板块中文名（如 '芯片概念'），按名称精确匹配，命中第一条
      - source (可选): 配合 sector_code 消歧，THS / TDX；按 sector_name 查询时会自动识别板块来源，无需传。显式指定 THS 时不会跨到通达信匹配

      【注意】sector_code 和 sector_name 至少提供一个，否则返回 success=false。同名板块可能跨数据来源，用 sector_code 时建议同时给 source

      【返回字段】data 为成分股数组，每项: stock_code(6位数字), stock_name, rank；板块不存在时返回空数组且 error 为 "Sector not found"

      【返回示例】
      成功: {"success": true, "data": [{"stock_code": "600519", "stock_name": "贵州茅台", "rank": 1}], "error": null, "source": "omni", "hops": []}
    routing: omni_get_sector_stocks
    upstream_tool_mapping:
      omni: omni_get_sector_stocks
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: sector_code
        type: str
        required: false
        description: 板块代码。THS 为 6 位数字（如 885756）；TDX 标准为 880569.SH，传 880569 省略 .SH 也可自动识别
      - name: sector_name
        type: str
        required: false
        description: 板块中文名（如 芯片概念），精确匹配
      - name: source
        type: str
        required: false
        enum: ["THS", "TDX"]
        description: 配合 sector_code 消歧，THS=同花顺 / TDX=通达信；省略表示全部

  - name: omni_get_stock_sectors
    description: |-
      【个股所属板块】查询指定股票所属的所有板块（行业/概念/地域/风格，跨数据来源聚合）。

      【使用场景】
      - 用户问"贵州茅台属于哪些板块"时调用
      - 主题投资筛选、交叉板块股票查找

      【参数说明】
      - stock_code (必填): 股票代码，自动归一化为 6 位数字。兼容 600519 / 600519.SH / sh600519 / SH600519 等写法

      【返回字段】data 为板块数组，每项: source(THS/TDX), board_type, code(板块代码), name；某股票无板块归属时返回空数组属正常

      【返回示例】
      成功: {"success": true, "data": [{"source": "THS", "board_type": "industry", "code": "881101", "name": "白酒"}, {"source": "THS", "board_type": "concept", "code": "885756", "name": "芯片概念"}], "error": null, "source": "omni", "hops": []}
      空数据: {"success": true, "data": [], ...}（该股票无板块归属是正常数据）
    routing: omni_get_stock_sectors
    upstream_tool_mapping:
      omni: omni_get_stock_sectors
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: stock_code
        type: str
        required: true
        description: 股票代码，兼容 6 位数字或带市场前缀/后缀（600519 / 600519.SH / sh600519）

  - name: omni_search_board
    description: |-
      【板块搜索】按名称或代码模糊搜索板块，跨所有数据来源（同花顺 + 通达信）。

      【使用场景】
      - 用户搜索特定板块时调用
      - 自动补全板块名称

      【参数说明】
      - keyword (必填): 搜索关键词（匹配板块名称或代码）

      【返回字段】data 为数组（最多返回前 50 条，按名称排序），每项: id, source(THS/TDX), board_type, code, name, stock_count(成分股数量)；keyword 为空时返回 success=false

      【返回示例】
      成功: {"success": true, "data": [{"id": 1, "source": "THS", "board_type": "concept", "code": "885756", "name": "芯片概念", "stock_count": 923}], "error": null, "source": "omni", "hops": []}
    routing: omni_search_board
    upstream_tool_mapping:
      omni: omni_search_board
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: keyword
        type: str
        required: true
        description: 搜索关键词（匹配板块名称或代码），最多返回 50 条
