  - name: get_daily_local
    description: |-
      【离线日线】读取通达信客户端本地 .day 文件，支持前/后复权。

      【使用场景】
      - 历史行情分析（不依赖网络，走本地数据）
      - 需要前/后复权数据时使用

      【参数说明】
      - code (必填): 股票代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀）
      - adjust (可选): 复权方式，默认 none
        none=不复权 / qfq=前复权 / hfq=后复权
      - start_date (可选): 起始日期 yyyy-MM-dd
      - end_date (可选): 结束日期 yyyy-MM-dd

      【代码消歧（重要）】
      - 裸 000xxx 是跨市场歧义码（000001=平安银行/上证指数，000002=万科A/上证A指），
        本入口按深市股票解析；成功返回时信封顶层 warn 字段会带消歧提示，
        读上证指数请显式传 sh000001，或改用 get_index_kline_local
      - 指数代码（sh000300、399001、880xxx、bj899050 等）请用 get_index_kline_local；
        指数传 qfq/hfq 会被强制为 none 并在 warn 说明
      - 北交所股票支持裸码（430/830/870/920 段）或显式 bj 前缀（如 bj920000）

      【数据源】{tdxdir}/vipdoc/{sh|sz|bj}/lday/{sh|sz|bj}xxx.day

      【返回信封】统一为 {success, data, error, source, hops, cache_hit}；
      成功但有非阻断提示（消歧/无本地文件/截断）时额外带顶层 warn 字段。
      成功: {"success": true, "data": [{"date": "2024-01-02", "open": 10.0, ...}], "source": "mootdx2"}
      歧义: {"success": true, "data": [...], "warn": "代码 000001 为跨市场歧义码…如需上证指数请显式传 sh000001"}
      失败: {"success": false, "error": "TDX 安装目录未配置"}
    routing: get_daily_local
    upstream_tool_mapping:
      mootdx2: get_daily
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 股票代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀；裸 000xxx 按深市股票解析）
      - name: adjust
        type: str
        required: false
        enum: [none, qfq, hfq]
        description: 复权方式：none=不复权 / qfq=前复权 / hfq=后复权
      - name: start_date
        type: str
        required: false
        description: 起始日期 yyyy-MM-dd（可选）
      - name: end_date
        type: str
        required: false
        description: 结束日期 yyyy-MM-dd（可选）

  - name: get_daily_batch_local
    description: |-
      【批量离线日线】批量读取通达信客户端本地 .day 文件，支持前/后复权。

      【使用场景】
      - 批量获取多只股票历史行情（不依赖网络，走本地数据）
      - 需要同时获取多只股票数据时使用

      【参数说明】
      - codes (必填): 逗号分隔的股票代码（最多20只），如 "sh600036,sh600519"
      - adjust (可选): 复权方式，默认 none
        none=不复权 / qfq=前复权 / hfq=后复权
      - start_date (可选): 起始日期 yyyy-MM-dd
      - end_date (可选): 结束日期 yyyy-MM-dd

      【返回信封】{success, data: {symbol: [records...]}, source, error_detail.warn}
      成功: {"success": true, "data": {"sh600036": [...], "sh600519": [...]}, "source": "mootdx2"}
      部分成功: {"success": true, "data": {"sh600036": [...]}, "error_detail": {"warn": "sh123456: invalid_symbol"}}
    routing: get_daily_batch_local
    upstream_tool_mapping:
      mootdx2: get_daily_batch_local
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: codes
        type: str
        required: true
        description: 逗号分隔的股票代码（最多20只），如 "sh600036,sh600519"
      - name: adjust
        type: str
        required: false
        enum: [none, qfq, hfq]
        description: 复权方式：none=不复权 / qfq=前复权 / hfq=后复权
      - name: start_date
        type: str
        required: false
        description: 起始日期 yyyy-MM-dd（可选）
      - name: end_date
        type: str
        required: false
        description: 结束日期 yyyy-MM-dd（可选）

  - name: get_minute_local
    description: |-
      【离线分钟线】读取通达信客户端本地 .lc1 / .lc5 文件，支持 1 分钟和 5 分钟周期。

      【使用场景】
      - 历史分钟级别回放
      - 不依赖网络

      【参数说明】
      - code (必填): 股票代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀）
      - suffix (可选): '1' = 1 分钟线（默认）/ '5' = 5 分钟线
      - start_date (可选): 起始日期 yyyy-MM-dd
      - end_date (可选): 结束日期 yyyy-MM-dd

      【数据源】
      - suffix='1': {tdxdir}/vipdoc/{sh|sz|bj}/minline/xxx.lc1
      - suffix='5': {tdxdir}/vipdoc/{sh|sz|bj}/fzline/xxx.lc5
    routing: get_minute_local
    upstream_tool_mapping:
      mootdx2: get_minute
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 股票代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀）
      - name: suffix
        type: str
        required: false
        enum: ['1', '5']
        description: '1=1 分钟线（默认）/ 5=5 分钟线'
      - name: start_date
        type: str
        required: false
        description: 起始日期 yyyy-MM-dd（可选）
      - name: end_date
        type: str
        required: false
        description: 结束日期 yyyy-MM-dd（可选）

  - name: get_fzline_local
    description: |-
      【离线 5 分钟K线】读取通达信客户端本地 .lc5 文件（fzline 子目录）。
      注意 fzline 是通达信目录名，数据为跨多日的 5 分钟 OHLC K线，不是分时图；
      当日实时分时请用在线 get_minute_data。

      【使用场景】
      - 历史 5 分钟K线回放
      - 与 get_minute suffix='5' 等价（相同数据源 fzline/*.lc5）

      【参数说明】
      - code (必填): 股票代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀）

      【数据源】{tdxdir}/vipdoc/{sh|sz|bj}/fzline/xxx.lc5
    routing: get_fzline_local
    upstream_tool_mapping:
      mootdx2: get_fzline
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 股票代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀）

  - name: get_index_kline_local
    description: |-
      【离线指数K线】读取通达信客户端本地指数 .day 文件（无复权），支持日/周/月。

      【使用场景】
      - 离线环境分析指数历史走势（不依赖网络）
      - 与在线 get_index_kline 对应，数据源为本地 vipdoc 文件

      【参数说明】
      - code (必填): 指数代码，6 位数字或带 sh/sz/bj 前缀（也支持 .SH/.SZ/.BJ 后缀）
        · sh 指数段：000xxx（上证指数/中证老系列）、880/881xxx（通达信板块指数）、
          930/931/932xxx（中证新号段，如 932000=中证A500）
        · sz 指数段：399xxx（如 399001 深证成指）
        · bj 指数段：899xxx（北证指数，如 bj899050；裸码 899050 亦可）
        · 裸 000xxx 为歧义码（上证指数 vs 深市股票），本工具按 sh 指数解析
          （如 000001=上证指数、000300=沪深300）；显式前缀始终生效
      - type (可选): day(默认)/week/month；week/month 由本地日线重采样
      - limit (可选): 返回最近 N 条，默认 100，最大 1000；超限时截断并在信封 warn 说明

      【数据源】{tdxdir}/vipdoc/{sh|sz|bj}/lday/{sh|sz|bj}xxx.day
      【返回信封】统一为 {success, data, error, source, hops, cache_hit}；
      成功但有非阻断提示（本地无文件/截断）时额外带顶层 warn 字段。
      【典型情况】
      - invalid_symbol: 传入股票代码（如 600000/sz000001/bj920000）请改用 get_daily_local，success=false
      - no_data: 指数 .day 本地不存在（TDX 未下载该数据），不代表代码错误；
        success=true、data=null，具体缺失路径在 warn 中给出（如 sh932xxx 本机未下载）
    routing: get_index_kline_local
    upstream_tool_mapping:
      mootdx2: get_index_kline_local
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 指数代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀；裸 000xxx 按 sh 指数解析）
      - name: type
        type: str
        required: false
        enum: [day, week, month]
        description: K线周期：day=日线(默认)/week=周线/month=月线
      - name: limit
        type: int
        required: false
        description: 返回最近 N 条（默认 100，最大 1000）

  - name: get_index_minute_local
    description: |-
      【离线指数分钟线】读取通达信客户端本地指数 .lc1 / .lc5 文件，支持 1 分钟和 5 分钟周期。

      【使用场景】
      - 离线环境回放指数分钟级走势（不依赖网络）
      - 与 get_index_kline_local（日/周/月）互补，覆盖分钟周期

      【参数说明】
      - code (必填): 指数代码，6 位数字或带 sh/sz/bj 前缀（也支持 .SH/.SZ/.BJ 后缀）
        · sh 指数段：000xxx（上证指数/中证老系列）、880/881xxx（通达信板块指数）、
          930/931/932xxx（中证新号段，如 932000=中证A500）
        · sz 指数段：399xxx（如 399001 深证成指）
        · bj 指数段：899xxx（北证指数，如 bj899050；裸码 899050 亦可）
        · 裸 000xxx 为歧义码（上证指数 vs 深市股票），本工具按 sh 指数解析
          （如 000001=上证指数、000300=沪深300）；显式前缀始终生效
      - suffix (可选): '1' = 1 分钟线（默认）/ '5' = 5 分钟线
      - start_date (可选): 起始日期，YYYY-MM-DD（如 2026-09-18，兼容
        YYYYMMDD 紧凑写法），含当日
      - end_date (可选): 结束日期，同上，含当日全天；非零填充/非法日历日或
        start_date 晚于 end_date → invalid_param
      - limit (可选): 返回最近 N 条，默认 1000，最大 20000；超出时截断为最近
        N 条并在信封 warn 中说明（无日期窗时给文件总数，带日期窗时给窗内条数）

      【数据源】
      - suffix='1': {tdxdir}/vipdoc/{sh|sz|bj}/minline/xxx.lc1
      - suffix='5': {tdxdir}/vipdoc/{sh|sz|bj}/fzline/xxx.lc5
      【返回信封】统一为 {success, data, error, source, hops, cache_hit}；
      成功但本地无文件时 success=true、data=null，缺失路径在顶层 warn 中给出。
      【典型情况】
      - invalid_param: suffix 非 '1'/'5'、日期非 YYYY-MM-DD/YYYYMMDD 合法日历日、
        start_date 晚于 end_date、limit 非正整数或 >20000，success=false
      - invalid_symbol: 传入股票代码（如 600000/sz000001）请改用 get_minute_local，success=false
      - no_data: 指数分钟文件本地不存在或为空（TDX 未下载该数据），不代表代码错误；
        文件存在但所选日期范围内无数据时，warn 会明确提示"文件存在但日期范围内无数据"
    routing: get_index_minute_local
    upstream_tool_mapping:
      mootdx2: get_index_minute_local
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 指数代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀；裸 000xxx 按 sh 指数解析）
      - name: suffix
        type: str
        required: false
        enum: ['1', '5']
        description: '1=1 分钟线（默认，minline/.lc1）/ 5=5 分钟线（fzline/.lc5）'
      - name: start_date
        type: str
        required: false
        description: 起始日期 YYYY-MM-DD（兼容 YYYYMMDD，可选）
      - name: end_date
        type: str
        required: false
        description: 结束日期 YYYY-MM-DD（兼容 YYYYMMDD，含当日全天，可选）
      - name: limit
        type: int
        required: false
        description: 返回最近 N 条（默认 1000，最大 20000，超出截断并带 warn）

  - name: get_index_fzline_local
    description: |-
      【离线指数 5 分钟线】读取通达信客户端本地指数 .lc5 文件（fzline 子目录）。

      【使用场景】
      - 离线环境回放指数 5 分钟走势
      - 与 get_index_minute_local(code, suffix='5') 等价（相同数据源 fzline/*.lc5）

      【参数说明】
      - code (必填): 指数代码，前缀/歧义码约定同 get_index_minute_local
        （000xxx 裸码按 sh 指数；399=sz；899=bj；880/881/930-932=sh）
      - limit (可选): 返回最近 N 条，默认 1000，最大 20000；超出截断并在
        信封 warn 中说明

      【数据源】{tdxdir}/vipdoc/{sh|sz|bj}/fzline/xxx.lc5
      【返回信封】同 get_index_minute_local（含截断 warn）；股票代码 → invalid_symbol 请改用 get_fzline_local。
    routing: get_index_fzline_local
    upstream_tool_mapping:
      mootdx2: get_index_fzline_local
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 指数代码（6 位数字，可带 sh/sz/bj 前缀或 .SH/.SZ/.BJ 后缀；裸 000xxx 按 sh 指数解析）
      - name: limit
        type: int
        required: false
        description: 返回最近 N 条（默认 1000，最大 20000，超出截断并带 warn）
