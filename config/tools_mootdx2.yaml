    cache_ttl_key:
    data_source_type: mixed
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码
      - name: market
        type: str
        required: false
        description: 市场前缀：sh/sz/bj（默认 sz）
      - name: kline_period
        type: str
        required: false
        description: K线周期：day/week/month/minute1/5/15/30/60（默认 day）
      - name: kline_count
        type: int
        required: false
        description: K线返回条数（默认 100）

