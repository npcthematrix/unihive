      【返回示例】
      成功: {"success": true, "data": ["20240101", "20240102", "20240103", ...]}
      失败: {"success": false, "error": {"error_type": "invalid_param", "message": "日期格式错误"}}

      【典型错误】
      - invalid_param: 日期格式错误 / start 晚于 end
    routing: get_workday_range
    upstream_tool_mapping:
