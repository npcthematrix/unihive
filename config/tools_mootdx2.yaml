  # ===== 离线接口 (4) =====
  - name: get_k_data
    description: |-
      【K线数据】通过 TDX 服务器获取指定日期范围的日线数据。

      【使用场景】
      - 当需要获取任意历史日期范围的 K 线数据时调用
      - 数据实时从 TDX 服务器拉取（非本地缓存）
      - 适合离线环境或需要快速读取历史数据时
      - 不适合：实时行情（用 get_kline）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）
      - start_date (可选): 开始日期 YYYYMMDD，空则从头开始
      - end_date (可选): 结束日期 YYYYMMDD，空则到最新

      【返回示例】
      成功: {"success": true, "data": [{"date": "2024-01-01", "open": 10.0, "high": 10.5, "low": 9.8, "close": 10.2, "vol": 100000}]}
      失败: {"success": false, "error": {"error_type": "no_data", "message": "本地无此股票数据"}}

      【典型错误】
      - no_data: 本地无此股票数据或文件不存在
    routing: get_k_data
    upstream_tool_mapping:
      mootdx2: get_k_data
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码
      - name: start_date
        type: str
        required: false
        description: 开始日期 YYYYMMDD（空则从头开始）
      - name: end_date
        type: str
        required: false
        description: 结束日期 YYYYMMDD（空则到最新）

  - name: get_minutes
    description: |-
      【分钟K线】通过 TDX 服务器获取指定日期的分钟级历史数据。

      【使用场景】
      - 当需要查询某一天的全天分钟级行情时调用
      - 数据实时从 TDX 服务器拉取（非本地缓存）
      - 适合离线环境或需要特定日期的分时数据
      - 不适合：今日分时（用 get_minute_data）

      【参数说明】
      - symbol (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）
      - date (可选): 日期，默认 '20191023'

      【返回示例】
      成功: {"success": true, "data": [{"time": "09:30:00", "open": 10.0, "high": 10.2, "low": 9.9, "close": 10.1, "vol": 1000}, ...]}
      失败: {"success": false, "error": {"error_type": "no_data", "message": "本地无此股票分钟数据"}}

      【典型错误】
      - no_data: 本地无此股票分钟数据或文件不存在
    routing: get_minutes
    upstream_tool_mapping:
      mootdx2: get_minutes
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: symbol
        type: str
        required: true
        normalize: code
        description: 股票代码
      - name: date
        type: str
        required: false
        description: 日期（默认 '20191023'）

  - name: search_stock_local
    description: |-
      【搜索股票（本地）】在本地 block 文件中模糊搜索股票。

      【使用场景】
      - 当用户输入股票名称或代码片段进行搜索时调用
      - 基于本地 block 板块文件，支持名称/代码/拼音模糊匹配
      - 适合离线环境或快速搜索
      - 不适合：全量列表（用 get_code_list）

      【参数说明】
      - keyword (必填): 搜索关键词（股票名称、代码或拼音缩写）

      【返回示例】
      成功: {"success": true, "data": [{"code": "600000", "market": "sh", "name": "浦发银行"}, ...]}
      失败: {"success": false, "error": {"error_type": "no_data", "message": "未找到匹配股票"}}

      【典型错误】
      - no_data: 未找到匹配股票
    routing: search_stock_local
    upstream_tool_mapping:
      mootdx2: search_stock
    cache_ttl_key:
    data_source_type: offline
    dangerous: false
    params:
      - name: keyword
        type: str
        required: true
        description: 搜索关键词（股票名称、代码或拼音缩写）

  - name: mootdx2_stock_info
    description: |-
      【聚合股票信息（mootdx2）】混合调用：在线快照 + 本地 K 线 + 本地分时。
      与 tdx_quant 的 get_stock_info（基础信息）不同：返回 quote + kline + minute 多维度数据。

      【使用场景】
      - 当用户需要获取股票的综合信息（实时行情 + 历史 K 线 + 分时）时调用
      - 一个请求获取多维度数据，适合股票详情页面
      - 不适合：仅需单一数据（分别用 get_quote / get_kline / get_minute_data）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）
      - market (可选): 市场前缀，默认 sz（sh/sz/bj）
      - kline_period (可选): K线周期，默认 day
      - kline_count (可选): K线返回条数，默认 100

      【返回示例】
      成功: {"success": true, "data": {"code": "600000", "market": "sh", "quote": {...}, "kline": [...], "minute": [...]}}
      失败: {"success": true, "data": {"code": "600000", "market": "sh", "quote": null, "kline": [], "minute": []}, "error": {"error_type": "no_data"}}

      【典型错误】
      - no_data: 股票无任何数据（可能代码错误或停牌）
    routing: mootdx2_stock_info
    upstream_tool_mapping:
      mootdx2: get_stock_info
    cache_ttl_key:
    data_source_type: mixed
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码
      - name: market
        type: str
        required: false
        description: 市场前缀：sh/sz/bj（默认 sz）
      - name: kline_period
        type: str
        required: false
        description: K线周期：day/week/month/minute1/5/15/30/60（默认 day）
      - name: kline_count
        type: int
        required: false
        description: K线返回条数（默认 100）

  - name: get_index_overview
    description: |-
      【主要指数概览】获取 A 股 6 大主要指数的实时行情。

      【使用场景】
