      - 数据实时从 TDX 服务器拉取（非本地缓存）
      - 适合离线环境或需要快速读取历史数据时
      - 不适合：实时行情（用 get_kline）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）
      - start_date (可选): 开始日期 YYYYMMDD，空则从头开始
      - end_date (可选): 结束日期 YYYYMMDD，空则到最新

      【返回示例】
