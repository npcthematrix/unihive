    cache_ttl_key: realtime_quote
    data_source_type: online
    dangerous: false
    params:
      - name: sort_by
        type: str
        required: false
        description: 排序字段：change_pct(默认)/amplitude/turnover/volume_ratio/amount
      - name: direction
        type: str
        required: false
        description: 排序方向：desc(默认，降序)/asc(升序)
      - name: limit
        type: int
        required: false
        description: 返回条数（默认50，最大200）
      - name: market
        type: str
        required: false
        description: 市场过滤：all(默认)/sh/sz/bj

