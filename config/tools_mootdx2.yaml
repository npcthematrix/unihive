# MooTDX2 工具规格
# 在线接口 (24): mootdx2.quotes.Quotes, TCP 网络连接通达信服务器，需要网络
# 离线接口 (4): mootdx2.reader.Reader, 读取本地 vipdoc 目录二进制文件，不需要网络
tools:
  # ===== 在线接口 (24) =====
  - name: get_quote
    description: |-
      【实时行情】获取单只股票的最新五档行情数据。

      【使用场景】
      - 当用户问"某只股票现在价格/涨跌幅/成交量"时调用
      - 当需要实时价格触发交易信号时调用
      - 不适合：批量查询（用 get_batch_quote）、历史数据（用 get_kline）

      【参数说明】
      - code (必填): 股票代码，支持格式：
        - 6位纯数字："600000"（系统自动推断市场）
        - 带前缀："sh600000"、"sz000001"、"bj8xxxxx"
        - 取值范围：沪深京 A 股、ETF、指数

      【返回示例】
      成功: {"success": true, "data": {"symbol": "600000", "close": 10.5, "open": 10.2, "high": 10.8, "low": 10.1, "volume": 1000000}}
      失败（停牌/非交易日）: {"success": true, "data": null, "error": {"error_type": "no_data", "message": "股票停牌或非交易日"}}
      失败（无效代码）: {"success": false, "error": {"error_type": "invalid_symbol", "message": "股票代码不存在"}}

      【典型错误】
      - invalid_symbol: 传入不存在的股票代码
      - no_data: 股票停牌或非交易日，无需重试
    routing: get_quote
    upstream_tool_mapping:
      mootdx2: get_quote
    cache_ttl_key: realtime_quote
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码，如 '600000' 或 'sh600000'

  - name: get_kline
    description: |-
      【K线数据】获取股票/指数的 K 线数据（日/周/月/分钟级别）。

      【使用场景】
      - 当用户问"某只股票近期走势/历史行情"时调用
      - 当需要技术分析指标时调用
      - 不适合：实时行情（用 get_quote）、分时数据（用 get_minute_data）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）
      - type (可选): K线类型，默认 day
        - day=日K / week=周K / month=月K
        - minute1=1分钟 / minute5=5分钟 / minute15=15分钟 / minute30=30分钟 / minute60=60分钟
      - limit (可选): 返回根数，默认 100，最大 1000

      【返回示例】
      成功: {"success": true, "data": [{"date": "2024-01-01", "open": 10.0, "high": 10.5, "low": 9.8, "close": 10.2, "volume": 100000}]}
      失败: {"success": false, "error": {"error_type": "invalid_symbol", "message": "股票代码不存在"}}

      【典型错误】
      - invalid_symbol: 股票代码不存在
      - invalid_param: limit 超过 1000，数据量过大
    routing: get_kline
    upstream_tool_mapping:
      mootdx2: get_kline
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码，如 '600000' 或 'sh600000'
      - name: type
        type: str
        required: false
        enum: [day, week, month, minute1, minute5, minute15, minute30, minute60]
        description: K线类型：day=日K / week=周K / month=月K / minute1=1分钟 / minute5=5分钟 / minute15=15分钟 / minute30=30分钟 / 
          minute60=60分钟（默认 day）
      - name: limit
        type: int
        required: false
        description: 返回根数（默认 100，最大 1000）

  - name: get_batch_quote
    description: |-
      【批量行情】批量获取多只股票的实时行情。

      【使用场景】
      - 当用户问"帮我看一下这几只股票的价格"（多个代码）时调用
      - 不适合：单只股票（用 get_quote）、历史数据（用 get_kline）

      【参数说明】
      - codes (必填): 逗号分隔的股票代码列表，最多 50 只
        - 示例：'600000,000001' 或 'sh600000,sz000001'

      【返回示例】
      成功: {"success": true, "data": [{"symbol": "600000", "close": 10.5, ...}, {"symbol": "000001", "close": 12.0, ...}]}
      失败: {"success": false, "error": {"error_type": "invalid_param", "message": "批量请求超过 50 只股票限制"}}

      【典型错误】
      - invalid_param: 股票数量超过 50 只限制
    routing: get_batch_quote
    upstream_tool_mapping:
      mootdx2: get_batch_quote
    cache_ttl_key: realtime_quote
    data_source_type: online
    dangerous: false
    params:
      - name: codes
        type: str
        required: true
        description: 逗号分隔的股票代码，最多 50 只，如 '600000,000001'

  - name: batch_bars
    description: |-
      【批量K线】批量获取多只股票的K线数据。

      【使用场景】
      - 当用户需要同时查看多只股票的历史走势时调用
      - 适合对比多只股票的K线趋势
      - 不适合：单只股票（用 get_kline）、实时行情（用 get_quote）

      【参数说明】
      - codes (必填): 逗号分隔的股票代码列表，最多 20 只
        - 示例：'600000,000001' 或 'sh600000,sz000001'
      - type (可选): K线类型，默认 day
        - day=日K / week=周K / month=月K
        - minute1=1分钟 / minute5=5分钟 / minute15=15分钟 / minute30=30分钟 / minute60=60分钟
      - limit (可选): 每只股票返回根数，默认 100，最大 500

      【返回示例】
      成功: {"success": true, "data": {"600000": [{date: "2024-01-01", open: 10.0, ...}], "000001": [...]}}
      失败: {"success": false, "error": {"error_type": "invalid_param", "message": "批量请求超过 20 只股票限制"}}

      【典型错误】
      - invalid_param: 股票数量超过 20 只限制
    routing: batch_bars
    upstream_tool_mapping:
      mootdx2: batch_bars
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: codes
        type: str
        required: true
        description: 逗号分隔的股票代码，最多 20 只，如 '600000,000001'
      - name: type
        type: str
        required: false
        enum: [day, week, month, minute1, minute5, minute15, minute30, minute60]
        description: K线类型（默认 day）
      - name: limit
        type: int
        required: false
        description: 每只股票返回根数（默认 100，最大 500）

  - name: get_minute_data
    description: |-
      【今日分时】获取单只股票今日的分时数据（240 根）。

      【使用场景】
      - 当用户问"今日分时走势"或需要当日盘中实时数据时调用
      - 不适合：历史分时（用 get_minutes）、K线（用 get_kline）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）

      【返回示例】
      成功: {"success": true, "data": [{"time": "09:30:00", "price": 10.5, "volume": 1000}, ...]}
      失败: {"success": true, "data": null, "error": {"error_type": "no_data", "message": "股票停牌或非交易日"}}

      【典型错误】
      - no_data: 非交易时段或停牌股票无分时数据
    routing: get_minute_data
    upstream_tool_mapping:
      mootdx2: get_minute
    cache_ttl_key: realtime_quote
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码，如 '600000' 或 'sh600000'

  - name: get_trade
    description: |-
      【逐笔成交】获取股票今日的逐笔成交明细。

      【使用场景】
      - 当用户问"今日逐笔成交/大单交易"时调用
      - 当需要分析当日交易活跃度和大单时调用
      - 不适合：历史逐笔（用 get_trade_history）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）

      【返回示例】
      成功: {"success": true, "data": [{"time": "09:30:05", "price": 10.5, "volume": 1000, "buyorsell": "B"}, ...]}
      失败: {"success": true, "data": null, "error": {"error_type": "no_data", "message": "股票停牌或非交易日"}}

      【典型错误】
      - no_data: 非交易时段或停牌股票无逐笔数据
    routing: get_trade
    upstream_tool_mapping:
      mootdx2: get_trade
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码，如 '600000' 或 'sh600000'

  - name: get_trade_history
    description: |-
      【历史逐笔】获取股票指定日期的历史逐笔成交（分页）。

      【使用场景】
      - 当用户问"某只股票某日的逐笔成交"时调用
      - 当需要分析特定日期的大单交易时调用
      - 不适合：今日逐笔（用 get_trade）、历史 K 线（用 get_kline）

      【参数说明】
      - code (必填): 股票代码，支持格式：6位纯数字或带前缀（sh/sz/bj）
      - date (可选): 日期，格式 YYYYMMDD，省略则查最近有数据的日期
      - start (可选): 起始偏移，默认 0
      - count (可选): 返回条数，默认 100，最大 500

      【返回示例】
      成功: {"success": true, "data": [{"time": "09:30:05", "price": 10.5, "volume": 1000}, ...]}
      失败: {"success": false, "error": {"error_type": "invalid_symbol", "message": "股票代码不存在"}}

      【典型错误】
      - invalid_symbol: 股票代码不存在
    routing: get_trade_history
    upstream_tool_mapping:
      mootdx2: get_trade_history
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        normalize: code
        description: 股票代码
      - name: date
        type: str
        required: false
        description: 日期 YYYYMMDD
      - name: start
        type: int
        required: false
        description: 起始偏移（默认 0）
      - name: count
        type: int
        required: false
        description: 返回条数（默认 100，最大 500）

  - name: get_index_kline
    description: |-
      【指数K线】获取指数的 K 线数据。

      【使用场景】
      - 当用户问"上证指数/深证成指的走势"时调用
      - 当需要分析大盘走势时调用
      - 不适合：股票 K 线（用 get_kline）、ETF（用 get_kline）

      【参数说明】
      - code (必填): 指数代码
        - '000001'：上证指数
        - '399001'：深证成指
        - 其他：沪深主要指数代码
      - type (可选): K线类型，默认 day（日K）

      【返回示例】
      成功: {"success": true, "data": [{"date": "2024-01-01", "open": 3000, "high": 3050, "low": 2980, "close": 3020, "volume": 100000000}]}
      失败: {"success": false, "error": {"error_type": "invalid_symbol", "message": "指数代码不存在"}}

      【典型错误】
      - invalid_symbol: 指数代码不存在
    routing: get_index_kline
    upstream_tool_mapping:
      mootdx2: get_index
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 指数代码，如 '000001'（上证指数）或 '399001'（深证成指）
      - name: type
        type: str
        required: false
        enum: [day, week, month, minute1, minute5, minute15, minute30, minute60]
        description: K线类型（默认 day）

  - name: get_index_bars
    description: |-
      【指数K线（指定起止）】获取指数 K 线数据（指定起始位置和偏移量）。

      【使用场景】
      - 当用户需要获取指数特定范围的 K 线数据时调用
      - 适合分页加载指数历史数据
      - 不适合：简单日线查询（用 get_index_kline 即可）

      【参数说明】
      - symbol (必填): 指数代码，如 '000001'（上证指数）
      - frequency (可选): K线频率，默认 9=日线，其他：5=周线、6=月线
      - start (可选): 起始位置，默认 0
      - offset (可选): 偏移量，默认 800

      【返回示例】
      成功: {"success": true, "data": [...]}
      失败: {"success": false, "error": {"error_type": "invalid_symbol", "message": "指数代码不存在"}}

      【典型错误】
      - invalid_symbol: 指数代码不存在
    routing: get_index_bars
    upstream_tool_mapping:
      mootdx2: get_index_bars
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: symbol
        type: str
        required: true
        description: 指数代码，如 '000001'（上证指数）
      - name: frequency
        type: int
        required: false
        description: K线频率：9=日线（默认）, 5=周线, 6=月线
      - name: start
        type: int
        required: false
        description: 起始位置（默认 0）
      - name: offset
        type: int
        required: false
        description: 偏移量（默认 800）

  - name: get_index_all
    description: |-
      【全指K线】获取指数 K 线数据（仅指数自身行情序列, 不返回指数包含的股票清单）。

      【使用场景】
      - 需要指数（如上证指数 sh000001）的日/周/月/分钟 K 线时调用
      - 本工具只返回指数自身行情序列, 指数包含的股票清单请使用板块类工具

      【参数说明】
      - code (必填): 指数代码（建议带 sh/sz 前缀, 如 sh000001）
      - type (可选): K线类型，默认 day
      - limit (可选): 返回条数

      【返回示例】
      成功: {"success": true, "data": [...]}
      失败: {"success": false, "error": {"error_type": "invalid_symbol", "message": "指数代码不存在"}}

      【典型错误】
      - invalid_symbol: 指数代码不存在
    routing: get_index_all
    upstream_tool_mapping:
      mootdx2: get_index_all
    cache_ttl_key: historical
    data_source_type: online
    dangerous: false
    params:
      - name: code
        type: str
        required: true
        description: 指数代码
      - name: type
        type: str
        required: false
        enum: [day, week, month, minute1, minute5, minute15, minute30, minute60]
        description: K线类型（默认 day）
      - name: limit
        type: int
        required: false
        description: 返回条数

  - name: get_code_list
    description: |-
      【全量代码列表】获取指定交易所的全部证券代码列表。

      【使用场景】
      - 当用户需要获取全市场股票代码列表时调用
      - 适合初始化或批量处理前的代码收集
      - 不适合：单只股票信息（用 get_quote）

      【参数说明】
      - exchange (可选): 交易所
        - sh=上海 / sz=深圳 / bj=北京
        - 省略则返回全部交易所

      【返回示例】
      成功: {"success": true, "data": [{"code": "600000", "name": "浦发银行"}, ...]}
      失败: {"success": false, "error": {"error_type": "invalid_param", "message": "无效的交易所代码"}}

      【典型错误】
      - invalid_param: 无效的交易所代码
    routing: get_code_list
    upstream_tool_mapping:
      mootdx2: get_code_list
    cache_ttl_key: ticker_list
    data_source_type: online
    dangerous: false
    params:
      - name: exchange
        type: str
        required: false
        enum: [sh, sz, bj]
        description: 交易所：sh=上海 / sz=深圳 / bj=北京（省略则返回全部）

  - name: get_stock_codes
    description: |-
      【股票代码列表】获取股票代码列表（分页）。

      【使用场景】
      - 当用户需要获取分页的股票代码列表时调用
      - 适合批量处理场景
      - 不适合：全量列表（用 get_code_list）

      【参数说明】
      - limit (可选): 返回数量，默认 100
      - prefix (可选): 是否带前缀，默认 False（如 sz000001）

      【返回示例】
      成功: {"success": true, "data": ["000001", "000002", ...]}
      失败: {"success": false, "error": {"error_type": "internal_error", "message": "获取失败"}}

      【典型错误】
      - internal_error: 服务内部错误
    routing: get_stock_codes
    upstream_tool_mapping:
      mootdx2: get_stock_codes
    cache_ttl_key: ticker_list
    data_source_type: online
    dangerous: false
    params:
      - name: limit
        type: int
        required: false
        description: 返回数量（默认 100）
      - name: prefix
        type: bool
        required: false
        description: 是否带前缀（默认 False）

  - name: get_etf_codes
    description: |-
      【ETF代码列表】获取 ETF 代码列表。

      【使用场景】
      - 当用户需要获取 ETF 产品代码列表时调用
      - 不适合：股票代码（用 get_stock_codes）

      【参数说明】
      - limit (可选): 返回数量，默认 100
      - prefix (可选): 是否带前缀，默认 False

      【返回示例】
      成功: {"success": true, "data": ["159001", "159003", ...]}
      失败: {"success": false, "error": {"error_type": "internal_error", "message": "获取失败"}}

      【典型错误】
      - internal_error: 服务内部错误
    routing: get_etf_codes
    upstream_tool_mapping:
      mootdx2: get_etf_codes
    cache_ttl_key: ticker_list
    data_source_type: online
    dangerous: false
    params:
      - name: limit
        type: int
        required: false
        description: 返回数量（默认 100）
      - name: prefix
        type: bool
        required: false
        description: 是否带前缀（默认 False）

  - name: get_etf_list
    description: |-
      【ETF列表】获取 ETF 产品列表（带详细信息）。

      【使用场景】
      - 当用户需要 ETF 的详细信息（如名称、交易所等）时调用
      - 不适合：仅需代码（用 get_etf_codes）

      【参数说明】
      - exchange (可选): 交易所过滤
      - limit (可选): 返回数量，默认 100

      【返回示例】
      成功: {"success": true, "data": [{"code": "159001", "name": "货币ETF", "exchange": "SZ"}, ...]}
      失败: {"success": false, "error": {"error_type": "internal_error", "message": "获取失败"}}

      【典型错误】
      - internal_error: 服务内部错误
    routing: get_etf_list
    upstream_tool_mapping:
      mootdx2: get_etf_list
    cache_ttl_key: ticker_list
    data_source_type: online
    dangerous: false
    params:
      - name: exchange
        type: str
        required: false
        description: 交易所过滤
      - name: limit
        type: int
        required: false
        description: 返回数量（默认 100）

  - name: get_market_count
    description: |-
      【市场证券数量】获取各市场的证券数量统计。

      【使用场景】
      - 当用户需要了解市场容量或统计信息时调用
      - 适合系统初始化或监控

      【参数说明】
      - 无参数

      【返回示例】
      成功: {"success": true, "data": {"market": 0, "count": 5000}}
      失败: {"success": false, "error": {"error_type": "internal_error", "message": "获取失败"}}

      【典型错误】
      - internal_error: 服务内部错误
    routing: get_market_count
    upstream_tool_mapping:
      mootdx2: get_market_count
    cache_ttl_key: ticker_list
    data_source_type: online
    dangerous: false
    params: []

  - name: get_workday
    description: |-
      【交易日查询】查询基准日前 N 个交易日。

      【使用场景】
      - 当用户需要计算某个日期前的第 N 个交易日时调用
      - 适合日期计算和交易日相关逻辑

      【参数说明】
      - date (可选): 基准日期，格式 YYYYMMDD（也接受 YYYY-MM-DD），省略则默认当天
      - count (可选): 往前查 N 个工作日，默认 1，允许范围 1-365

      【重要说明】
      - 本工具只做周末数学（周一至周五），**未剔除法定节假日**，
        网关不内置节假日历；国庆/春节等休市日及调休上班日会被计作交易日,
        对节假日敏感的场景请自行叠加节假日历

      【返回示例】
      成功: {"success": true, "data": ["20240101", "20240102", ...]}
      失败: {"success": false, "error": {"error_type": "invalid_param", "message": "日期格式错误"}}

      【典型错误】
      - invalid_param: 日期格式错误 / count 超出 1-365
    routing: get_workday
    upstream_tool_mapping:
      mootdx2: get_workday
    cache_ttl_key: workday
    data_source_type: offline
    dangerous: false
    params:
      - name: date
        type: str
        required: false
        description: 基准日期 YYYYMMDD（默认当天）
      - name: count
        type: int
        required: false
        description: 往前查 N 个工作日（默认 1, 范围 1-365; 未剔除法定节假日）

