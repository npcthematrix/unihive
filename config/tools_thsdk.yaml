  # ========== 板块 Blocks ==========

  - name: ths_list_block_descriptions
    description: |-
      【板块描述】批量查询多个板块的基本信息。对应 list_block_descriptions(*, blocks)。
      【参数】blocks (必填): 板块 ID 或名称数组，如 ["沪深300", "人工智能"] 或 [61322]
    routing: ths_list_block_descriptions
    upstream_tool_mapping:
      thsdk: ths_list_block_descriptions
    data_source_type: online
    dangerous: false
    params:
      - {name: blocks, type: "List[str]", required: true, description: "板块 ID 或名称数组，如 ['沪深300','人工智能']"}

  - name: ths_list_security_block_memberships
    description: |-
      【证券所属板块】查询单只证券所属的全部板块。对应 list_security_block_memberships(*, security)。
      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_list_security_block_memberships
    upstream_tool_mapping:
