  # ========== 新闻 News ==========

  - name: ths_list_hot_event_news
    description: |-
      【热点事件新闻】查询热点事件相关新闻，限定在指定板块内。
      对应 list_hot_event_news(*, block, range=None)；3.0.0 原生 block 必填。
      【参数】
      - block (必填): 板块数字 ID（如 "61322"）或名称（如 "沪深300"），网关自动归一
      - range (可选): 时间范围，"recent"=近期(默认) / "historical"=历史
    routing: ths_list_hot_event_news
    upstream_tool_mapping:
      thsdk: ths_list_hot_event_news
    data_source_type: online
    dangerous: false
    params:
      - {name: block, type: str, required: true, description: "板块数字 ID（如 61322）或名称（如 沪深300），网关自动归一"}
      - {name: range, type: str, required: false, enum: ["recent", "historical"], description: "时间范围：recent=近期(默认) / historical=历史"}

  - name: ths_list_security_news_events
    description: |-
      【个股新闻事件】查询指定证券在时间窗口内的新闻事件。
      对应原生 list_security_news_events(*, security, timeline, window)；timeline/window 原生必填，网关按 start/end 构造 window。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - timeline (可选): historical=历史(默认) / realtime=实时
      - start (必填): 窗口起点 ISO 时间，如 2026-08-01T00:00:00+08:00；与 end 必须同时提供
      - end (必填): 窗口终点 ISO 时间
    routing: ths_list_security_news_events
    upstream_tool_mapping:
      thsdk: ths_list_security_news_events
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: timeline, type: str, required: false, enum: [historical, realtime], description: "historical=历史(默认) / realtime=实时"}
      - {name: start, type: str, required: true, description: "窗口起点 ISO 时间，如 2026-08-01T00:00:00+08:00；与 end 同时提供"}
      - {name: end, type: str, required: true, description: "窗口终点 ISO 时间"}

  - name: ths_security_news
    description: |-
      【个股正式新闻】查询与某只个股相关的分类正式新闻（标题、摘要、来源、时间）。
      区别于 ths_news 的 7x24 全球快讯（flash）；本工具聚焦个股相关报道。
      对应 list_news_items(category, security, traversal, …)。
      【参数】
      - security (必填): 个股完整 THSCODE，如 USHA600519
      - mode (可选): since=增量(默认) / page=分页
    routing: ths_security_news
    upstream_tool_mapping:
      thsdk: ths_security_news
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "个股完整 THSCODE，如 USHA600519"}
      - {name: mode, type: str, required: false, enum: ["since", "page"], description: "since=增量(默认) / page=分页"}

  - name: ths_security_research_reports
    description: |-
      【个股券商研报】查询某只个股的券商研究报告：标题、机构、研究员、评级、EPS 预测、摘要与原文链接。
      对应 list_security_research_reports(security, traversal)；网关按分页模式请求。
      【参数】security (必填): 个股完整 THSCODE，如 USHA600519
    routing: ths_security_research_reports
    upstream_tool_mapping:
      thsdk: ths_security_research_reports
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "个股完整 THSCODE，如 USHA600519"}

  # ========== 实时统计 Realtime ==========

  - name: ths_calculate_security_realtime_statistics
    description: |-
      【实时统计】计算证券的实时统计指标（涨停时间/类型/状态）。
      对应原生 calculate_security_realtime_statistics(*, securities, metrics)；metrics 原生必填，网关默认下发全部 4 个指标。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519（内部包成 securities 数组）
      - metrics (可选): 指标名数组，可选 first_limit_up_time / final_limit_up_time / limit_up_type / limit_up_state；省略=全部
    routing: ths_calculate_security_realtime_statistics
    upstream_tool_mapping:
      thsdk: ths_calculate_security_realtime_statistics
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部包成 securities 数组）"}
      - {name: metrics, type: "List[str]", required: false, description: "指标数组：first_limit_up_time / final_limit_up_time / limit_up_type / limit_up_state；省略=全部"}

  - name: ths_get_security_short_term_highlights
    description: |-
      【短线亮点】查询证券短线亮点。对应 get_security_short_term_highlights(*, security)。
      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_get_security_short_term_highlights
    upstream_tool_mapping:
      thsdk: ths_get_security_short_term_highlights
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}

  - name: ths_list_security_price_volume_levels
    description: |-
      【量价分布】查询证券各价位成交量分布。对应 list_security_price_volume_levels(*, security)。
      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_list_security_price_volume_levels
    upstream_tool_mapping:
      thsdk: ths_list_security_price_volume_levels
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}

  # ========== 公司行为 Corporate ==========

  - name: ths_list_security_corporate_actions
    description: |-
      【公司行为(结构化)】查询证券分红、送转、配股历史（结构化列表）。
      对应原生 list_security_corporate_actions(*, security, start, end, adjust, period)，均原生必填，网关补默认（近 10 个日周期、不复权）。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - start (可选): 相对周期偏移，默认 -10
      - end (可选): 相对周期偏移，默认 0
      - adjust (可选): none=不复权(默认) / forward=前复权 / backward=后复权
      - period (可选): 周期，day=日(默认) / week / month / quarter / year / m1 / m5 / m15 / m30 / m60 / m120
    routing: ths_list_security_corporate_actions
    upstream_tool_mapping:
      thsdk: ths_list_security_corporate_actions
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: start, type: int, required: false, description: "相对周期偏移，默认 -10"}
      - {name: end, type: int, required: false, description: "相对周期偏移，默认 0"}
      - {name: adjust, type: str, required: false, enum: [none, forward, backward], description: "none=不复权(默认) / forward / backward"}
      - {name: period, type: str, required: false, enum: [m1, m5, m15, m30, m60, m120, day, week, month, quarter, year], description: "周期，默认 day"}

  - name: ths_list_security_financial_snapshots
    description: |-
      【财务快照】批量查询证券财务数据快照。
      对应 list_security_financial_snapshots(*, securities, fields=None)。
      【参数】
      - securities (必填): 完整 THSCODE 数组
      - fields (可选): 字段名数组，可选 total_shares / float_shares / net_asset_per_share；原生必填，省略时网关默认下发全部 3 个
    routing: ths_list_security_financial_snapshots
    upstream_tool_mapping:
      thsdk: ths_list_security_financial_snapshots
    data_source_type: online
    dangerous: false
    params:
      - {name: securities, type: "List[str]", required: true, description: "完整 THSCODE 数组"}
      - {name: fields, type: "List[str]", required: false, description: "字段数组：total_shares / float_shares / net_asset_per_share；省略=全部"}

  # ========== 涨跌停 Limit ==========

  - name: ths_analyze_security_limit_up
    description: |-
      【涨停分析】分析证券涨停特征。对应 analyze_security_limit_up(*, security, date=None)。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - date (可选): 分析日期 yyyy-MM-dd
    routing: ths_analyze_security_limit_up
    upstream_tool_mapping:
      thsdk: ths_analyze_security_limit_up
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: date, type: str, required: false, description: "分析日期 yyyy-MM-dd"}

  - name: ths_get_security_price_limit_events
    description: |-
      【涨跌停事件】查询证券历史涨跌停事件，可按年份过滤。
      对应 get_security_price_limit_events(*, security, start_year=None, end_year=None)。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - start_year (可选): 起始年份（整数），如 2024
      - end_year (可选): 结束年份（整数），如 2025
    routing: ths_get_security_price_limit_events
    upstream_tool_mapping:
      thsdk: ths_get_security_price_limit_events
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: start_year, type: int, required: false, description: "起始年份，如 2024"}
      - {name: end_year, type: int, required: false, description: "结束年份，如 2025"}

  # ========== 跨市场 Cross-Market ==========

  - name: ths_list_futures_related_securities
    description: |-
      【期货关联证券】查询与期货合约关联的证券列表。对应 list_futures_related_securities()，无参数。
    routing: ths_list_futures_related_securities
    upstream_tool_mapping:
      thsdk: ths_list_futures_related_securities
    data_source_type: online
    dangerous: false
    params: []

  - name: ths_list_security_ah_relations
    description: |-
      【AH股关联】查询证券的 AH 股对应关系。对应 list_security_ah_relations(*, security)。
      【参数】security (必填): 完整 THSCODE（沪市如 USHA601988 或港市如 HK03968）
    routing: ths_list_security_ah_relations
    upstream_tool_mapping:
      thsdk: ths_list_security_ah_relations
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA601988（沪）或 HK03968（港）"}

  - name: ths_list_security_futures_relations
    description: |-
      【期股关联】查询单只证券关联的期货合约。
      对应 list_security_futures_relations(securities)（位置参数数组）；网关把单个 security 包成数组传入。
      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_list_security_futures_relations
    upstream_tool_mapping:
      thsdk: ths_list_security_futures_relations
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部包成 securities 数组）"}

  # ========== 搜索 Search ==========

  - name: ths_search_securities
    description: |-
      【证券检索】按关键词检索证券，返回候选列表。对应 search_securities(*, pattern, market=None)。
      别名 ths_search_symbols（同一原生方法，入参名 pattern），二者择一即可。
      【参数】
      - keyword (必填): 搜索关键词（内部参数名 pattern）
      - market (可选): 市场前缀，如 USHA
    routing: ths_search_securities
    upstream_tool_mapping:
      thsdk: ths_search_securities
    data_source_type: online
    dangerous: false
    params:
      - {name: keyword, type: str, required: true, description: "搜索关键词（内部参数名 pattern）"}
      - {name: market, type: str, required: false, description: "市场前缀，如 USHA"}

  - name: ths_resolve_securities
    description: |-
      【证券解析】把代码解析为标准证券身份。对应 resolve_securities(*, codes)，原生 codes 只收裸数字码。
      别名 ths_complete_ths_code（同一原生方法）；本工具额外做市场一致性校验（推荐），需保留原始输入形式时用 complete 版本。
      【参数】codes (必填): 代码数组，元素支持 600519 / sh600519 / 600519.SH / USHA600519（网关统一剥成裸码后下发，自动去重）；无法识别的元素直接报参数错误，不静默丢弃。
      指数代码（如 sh000001 上证指数）裸码会与深市股票冲突，市场标记与代码段不一致时直接报参数错误；不支持北交所代码。
    routing: ths_resolve_securities
    upstream_tool_mapping:
      thsdk: ths_resolve_securities
    data_source_type: online
    dangerous: false
    params:
      - {name: codes, type: "List[str]", required: true, description: "代码数组，支持 600519 / sh600519 / 600519.SH / USHA600519；坏元素报错不静默丢弃"}

  # ========== 行情增强 Quotes ==========

  - name: ths_list_security_ticks
    description: |-
      【逐笔成交】查询证券逐笔成交记录。对应原生 list_security_ticks(*, security, window)；window 原生必填，网关按 count 或时间范围构造。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - count (可选): 最近成交条数，默认 100；与 start_time/end_time 二选一
      - start_time (可选): 时间范围起点 ISO，与 end_time 同时提供
      - end_time (可选): 时间范围终点 ISO
    routing: ths_list_security_ticks
    upstream_tool_mapping:
      thsdk: ths_list_security_ticks
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: count, type: int, required: false, description: "最近成交条数，默认 100"}
      - {name: start_time, type: str, required: false, description: "时间范围起点 ISO，与 end_time 同时提供"}
      - {name: end_time, type: str, required: false, description: "时间范围终点 ISO"}

  - name: ths_list_security_intraday_bars
    description: |-
      【分时Bar】查询证券分时 Bar。对应原生 list_security_intraday_bars(*, security, date)；date 原生必填，网关默认补 "0"（当天）。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - date (可选): 交易日 yyyy-MM-dd 或 "0"（当天，默认）
    routing: ths_list_security_intraday_bars
    upstream_tool_mapping:
      thsdk: ths_list_security_intraday_bars
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: date, type: str, required: false, description: "交易日 yyyy-MM-dd 或 \"0\"（当天，默认）"}

  - name: ths_list_security_order_books
    description: |-
      【订单簿】查询证券多档盘口。对应 list_security_order_books(*, securities, depth)；网关把单个 security 包成 securities 数组。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - depth (可选): 档位代码，库内置仅 "5"（五档，默认）
    routing: ths_list_security_order_books
    upstream_tool_mapping:
      thsdk: ths_list_security_order_books
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部包成 securities 数组）"}
      - {name: depth, type: str, required: false, enum: ["5"], description: "档位代码，仅支持 5=五档（默认）"}

  - name: ths_list_security_daily_capital_flows
    description: |-
      【每日资金流向】查询 A 股每日资金流向（超大/大/中/小单 × 主动/被动买卖额）。
      对应 list_security_daily_capital_flows(*, securities)；网关把单个 security 包成 securities 数组。
      ⚠ 仅支持个股（USHA/USZA 的 A 股）；ETF/基金（USHJ/USZJ）、指数、债券不支持
      （同花顺该接口按个股资金分单口径，基金无此数据，传入会明确报错）。
      【参数】security (必填): 个股完整 THSCODE，如 USHA600519
    routing: ths_list_security_daily_capital_flows
    upstream_tool_mapping:
      thsdk: ths_list_security_daily_capital_flows
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "个股完整 THSCODE，如 USHA600519；仅限 USHA/USZA 个股，不支持 USHJ/USZJ 基金/ETF"}

  - name: ths_get_market_security_names
    description: |-
      【证券名称列表】批量获取某市场证券代码与名称映射。
      对应 get_market_security_names(*, market, realtime_version_ini=None, history_version_ini=None, base_version_ini=None)；网关仅透传 market。
      【参数】market (必填): 市场前缀，如 USHA / USZA
    routing: ths_get_market_security_names
    upstream_tool_mapping:
      thsdk: ths_get_market_security_names
    data_source_type: online
    dangerous: false
    params:
      - {name: market, type: str, required: true, description: "市场前缀，如 USHA / USZA"}
