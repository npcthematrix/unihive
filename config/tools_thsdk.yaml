# THSDK 上游（panghu11033/thsdk 包，运行版本 3.0.0）工具定义
#
# THSCODE 格式：4 位市场前缀 + 代码，如 USHA600519（沪股）、USZA300033（深股）、
# USHJ510300（沪基金）、USZJ159915（深基金）、HK03968（港股；网关市场归一仅支持沪深，港股仅部分工具可用）。
# 只有短代码或名称时先调 ths_search_symbols / ths_complete_ths_code / ths_resolve_securities 拿到完整 THSCODE。
#
# 市场前缀（官方 get_market_metadata）：USHA=沪股 / USZA=深股 / USHJ=沪基金 / USZJ=深基金 / USHI·USZI=指数。
#
# 参数命名约定（网关层对外参数名 → thsdk 内部参数名）：
#   - 行情类对外统一用 security，内部映射 thsdk 的 ths_code（klines/intraday_data/depth/tick_level1/corporate_action）
#   - ths_get_price 对外 security 直接对应 thsdk 的 security
#   - 问财自然语言对外用 query，内部映射 wencai_nlp 的 condition
#   - 多个"单只证券"工具内部把 security 包成 thsdk 要求的 securities 数组
# 写工具通过 requires_env: ALLOW_WATCHLIST_WRITE 在加载期决定是否注册；clear/delete/replace 四类还需 confirm=true。
#
# 别名（同一原生方法的不同对外入口，择一使用即可，无需都调）：
#   - ths_search_symbols ≡ ths_search_securities（原生 search_securities；入参 pattern vs keyword）
#   - ths_complete_ths_code ≡ ths_resolve_securities（原生 resolve_securities；后者额外做市场一致性校验，推荐）
#   - ths_get_price ≈ ths_klines（别名；默认复权不同：get_price 默认前复权，klines 默认不复权，见各自描述）

tools:
  # ========== 认证与账户只读 ==========

  - name: ths_auth_status
    description: |-
      【登录状态】返回当前 THSDK 是否已登录、登录方式（credentials=账号密码 / guest=游客临时会话）、写开关状态。不暴露任何凭证。
      返回: {"authenticated": bool, "auth_mode": "credentials"|"guest", "guest": bool, "watchlist_write_enabled": bool}
    routing: ths_auth_status
    upstream_tool_mapping:
      thsdk: ths_auth_status
    data_source_type: online
    dangerous: false
    params: []

  - name: ths_account_permissions
    description: |-
      【账号权限】查询当前同花顺账号的数据权限（游客/正式账号可能不同）。无参数。不暴露凭证。
      【返回】运行组件解码后的权限信息对象；游客账号可能提示权限受限，此时请配置 THS_USERNAME/THS_PASSWORD。
    routing: ths_account_permissions
    upstream_tool_mapping:
      thsdk: ths_account_permissions
    data_source_type: online
    dangerous: false
    params: []

  - name: ths_get_account_watchlist
    description: |-
      【我的自选】查询当前账号主自选股快照。无参数。账号数据不缓存。
      【返回】{"version": 自选版本号, "securities": [...]}（2026-09-23 起由裸 list 变更为对象，破坏性变更）。
      整体替换自选 ths_replace_account_watchlist_securities 时，须把 version 原样回传作乐观锁。
    routing: ths_get_account_watchlist
    upstream_tool_mapping:
      thsdk: ths_get_account_watchlist
    data_source_type: online
    dangerous: false
    params: []

  - name: ths_get_account_watchlist_groups
    description: |-
      【我的自选分组】查询当前账号的全部分组及组内证券。无参数。
      【返回】分组 list，每组含 id/name/securities/version；写分组工具以 group_id 定位。
    routing: ths_get_account_watchlist_groups
    upstream_tool_mapping:
      thsdk: ths_get_account_watchlist_groups
    data_source_type: online
    dangerous: false
    params: []

  - name: ths_get_all_watchlist
    description: |-
      【全部自选（含分组）】网关聚合工具：一次合并"主自选"与"自选分组"。主自选用 group_id=0 的"默认分组"呈现，自定义分组用各自 id 呈现。无参数。
      【返回】{"version": 主自选版本, "group_order": [...], "groups": {id: {...}}, "main_watchlist": {count, securities, version}}。
    routing: ths_get_all_watchlist
    upstream_tool_mapping:
      thsdk: ths_get_all_watchlist
    data_source_type: online
    dangerous: false
    params: []

  # ========== 证券发现 ==========

  - name: ths_search_symbols
    description: |-
      【证券搜索】按代码/拼音缩写/中文名称搜索证券，返回候选的完整 THSCODE、名称与市场。
      别名 ths_search_securities（同一原生 search_securities，入参名 keyword），二者择一即可。
      对应 thsdk search_symbols(pattern, market=None)。
      【参数】
      - pattern (必填): 关键词，如 '600519' / 'gzmt' / '茅台'
      - market (可选): 限定市场前缀，如 USHA / USZA，省略搜全部市场
    routing: ths_search_symbols
    upstream_tool_mapping:
      thsdk: ths_search_symbols
    data_source_type: online
    dangerous: false
    params:
      - {name: pattern, type: str, required: true, description: "搜索关键词：代码/拼音/中文名，如 600519 / gzmt / 茅台"}
      - {name: market, type: str, required: false, description: "市场前缀过滤，如 USHA / USZA，省略搜全部市场"}

  - name: ths_complete_ths_code
    description: |-
      【短代码补全】把一个或多个短代码（如 300033、600519）批量解析为完整 THSCODE（如 USZA300033、USHA600519）。
      别名 ths_resolve_securities（同一原生方法）；resolve 版本额外做市场一致性校验，需要严格校验时优先用它。
      对应 thsdk complete_ths_code(ths_code)，入参支持单个字符串或字符串数组。
      【参数】codes (必填): 短代码或其数组，如 ["600519", "300033"]
    routing: ths_complete_ths_code
    upstream_tool_mapping:
      thsdk: ths_complete_ths_code
    data_source_type: online
    dangerous: false
    params:
      - {name: codes, type: "List[str]", required: true, description: "短代码或数组，如 ['600519','300033']"}

  # ========== 行情与基本面 ==========

  - name: ths_get_price
    description: |-
      【K线-参数版】查询单只证券 K 线，返回 records（DataFrame 编码），时间为 ISO 字符串。
      默认【前复权】(fq='pre')；传统别名 ths_klines 默认不复权、周期枚举为 day/week/month，按需选择。
      对应 thsdk get_price(security, start_date, end_date, frequency, fields, fq, count)。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - frequency (可选): 周期，默认 daily；可选 1m/5m/15m/30m/60m/120m/daily/weekly/monthly
      - count (可选): 最近 N 根，默认 20；与 start_date/end_date 二选一
      - fq (可选): 复权，pre=前复权(默认) / post=后复权；不复权请显式传空（库默认 pre）
      - start_date, end_date (可选): 日期范围，必须成对（支持 yyyy-MM-dd 或日期/整数）
      【注意】count 与日期范围二选一（成对给日期时走日期，否则按 count）。
    routing: ths_get_price
    upstream_tool_mapping:
      thsdk: ths_get_price
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}
      - {name: frequency, type: str, required: false, enum: ["1m", "5m", "15m", "30m", "60m", "120m", "daily", "weekly", "monthly"], description: "K 线周期，默认 daily"}
      - {name: count, type: int, required: false, description: "最近 N 根 K 线，默认 20；与日期范围二选一"}
      - {name: fq, type: str, required: false, enum: ["pre", "post"], description: "复权：pre=前复权(默认) / post=后复权"}
      - {name: start_date, type: str, required: false, description: "起始日期 yyyy-MM-dd，必须与 end_date 成对"}
      - {name: end_date, type: str, required: false, description: "结束日期 yyyy-MM-dd，必须与 start_date 成对"}

  - name: ths_klines
    description: |-
      【K线-传统参数名】ths_get_price 的传统别名（底层同为取 K 线）。
      ⚠ 默认复权与 get_price 不同：本工具默认【不复权】(adjust='')，get_price 默认【前复权】(fq='pre')；周期枚举也不同（本工具 day/week/month，get_price daily/weekly/monthly）。
      对应 thsdk klines(ths_code, start_time, end_time, adjust, interval, count)；网关对外参数名用 security。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - interval (可选): 周期，默认 day；可选 1m/5m/15m/30m/60m/120m/day/week/month
      - count (可选): 条数，默认 20；与 start_time/end_time 二选一
      - adjust (可选): 复权，省略或空串=不复权(默认 '')；pre=前复权 / post=后复权
      - start_time, end_time (可选): 日期范围，必须成对
    routing: ths_klines
    upstream_tool_mapping:
      thsdk: ths_klines
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部参数名 ths_code）"}
      - {name: interval, type: str, required: false, enum: ["1m", "5m", "15m", "30m", "60m", "120m", "day", "week", "month"], description: "周期，默认 day"}
      - {name: count, type: int, required: false, description: "条数，默认 20"}
      - {name: adjust, type: str, required: false, description: "复权；省略或空串=不复权(库默认 '')"}
      - {name: start_time, type: str, required: false, description: "起始日期 yyyy-MM-dd，与 end_time 成对"}
      - {name: end_time, type: str, required: false, description: "结束日期 yyyy-MM-dd，与 start_time 成对"}

  - name: ths_daily_k_lines_with_prev_close
    description: |-
      【日线含前收盘】查询 A 股日 K 线及其前一日收盘价（prev_close），可据此计算跳空缺口与真实涨跌幅。
      对应 list_security_daily_k_lines_with_previous_close(security, start, end, adjust)；网关按最近 N 根构造。
      【参数】
      - security (必填): 个股完整 THSCODE，如 USHA600519
      - count (可选): 最近交易日数，默认 20
    routing: ths_daily_k_lines_with_prev_close
    upstream_tool_mapping:
      thsdk: ths_daily_k_lines_with_prev_close
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "个股完整 THSCODE，如 USHA600519"}
      - {name: count, type: int, required: false, description: "最近交易日数，默认 20"}

  - name: ths_intraday_data
    description: |-
      【分时】查询证券当天或指定交易日的分时走势。
      对应 thsdk intraday_data(ths_code, date)；网关对外参数名用 security。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - date (可选): 交易日 yyyy-MM-dd（也接受 date/datetime/整数），省略=当天
    routing: ths_intraday_data
    upstream_tool_mapping:
      thsdk: ths_intraday_data
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部参数名 ths_code）"}
      - {name: date, type: str, required: false, description: "交易日 yyyy-MM-dd，省略查当天"}

  - name: ths_depth
    description: |-
      【五档盘口】查询一只证券的五档买卖盘。
      对应 thsdk depth(ths_code)（ths_code 也接受数组，但本工具按单个证券传）。
      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_depth
    upstream_tool_mapping:
      thsdk: ths_depth
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部参数名 ths_code），单个证券"}

  - name: ths_index_call_auction_quotes
    description: |-
      【指数集合竞价】查询指数在集合竞价（开盘 opening / 收盘 closing）阶段的快照：价格、成交量等。
      对应 list_index_call_auction_quotes(index, phase)。
      【参数】
      - index (必填): 指数完整代码，如 USHI1A0001（上证指数）、USZI399001（深证成指）
      - phase (可选): opening=开盘竞价(默认) / closing=收盘竞价
    routing: ths_index_call_auction_quotes
    upstream_tool_mapping:
      thsdk: ths_index_call_auction_quotes
    data_source_type: online
    dangerous: false
    params:
      - {name: index, type: str, required: true, description: "指数完整代码，如 USHI1A0001 / USZI399001"}
      - {name: phase, type: str, required: false, enum: ["opening", "closing"], description: "opening=开盘竞价(默认) / closing=收盘竞价"}

  - name: ths_tick_level1
    description: |-
      【逐笔成交(L1)】查询普通逐笔成交（非 Level-2）。
      对应 thsdk tick_level1(ths_code, count=100, *, start_time=None, end_time=None)；start_time/end_time 为仅限关键字参数。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - count (可选): 最近条数，默认 100；与 start_time/end_time 互斥
      - start_time, end_time (可选): 时间范围（yyyy-MM-dd 或日期/datetime），必须成对传入；与 count 互斥
    routing: ths_tick_level1
    upstream_tool_mapping:
      thsdk: ths_tick_level1
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部参数名 ths_code）"}
      - {name: count, type: int, required: false, description: "最近条数，默认 100"}
      - {name: start_time, type: str, required: false, description: "起始时间 yyyy-MM-dd"}
      - {name: end_time, type: str, required: false, description: "结束时间 yyyy-MM-dd"}

  - name: ths_corporate_action
    description: |-
      【公司行为(简版)】查询证券分红、送转、配股与除权除息记录。
      对应 thsdk corporate_action(ths_code, count=100)。
      【参数】
      - security (必填): 完整 THSCODE，如 USHA600519
      - count (可选): 最近条数，默认 100
    routing: ths_corporate_action
    upstream_tool_mapping:
      thsdk: ths_corporate_action
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519（内部参数名 ths_code）"}
      - {name: count, type: int, required: false, description: "最近条数，默认 100"}

  # ========== 问财、板块、资讯 ==========

  - name: ths_wencai_nlp
    description: |-
      【问财自然语言选股】把自然语言条件（如"市盈率小于20，净利润增长率大于20%"）解析为证券池，动态字段展开为表格列。
      对应 thsdk wencai_nlp(condition, markets=None, limit=100)；网关对外用 query，内部映射 condition。
      【参数】
      - query (必填): 自然语言选股条件
      - markets (可选): 市场前缀或其数组，如 ["USHA","USZA"]，省略不限制
      - limit (可选): 返回条数，网关默认 50（库默认 100）
    routing: ths_wencai_nlp
    upstream_tool_mapping:
      thsdk: ths_wencai_nlp
    data_source_type: online
    dangerous: false
    params:
      - {name: query, type: str, required: true, description: "问财自然语言条件，如 市盈率小于20且净利润增长率大于20%（内部参数名 condition）"}
      - {name: markets, type: "List[str]", required: false, description: "市场前缀或数组，如 USHA / ['USHA','USZA']，省略不限制"}
      - {name: limit, type: int, required: false, description: "返回条数，默认 50"}

  - name: ths_news
    description: |-
      【7x24 快讯】分页查询同花顺 7x24 全球快讯。
      对应 thsdk news(*, page=1, page_size=20, tag='')，全部为仅限关键字参数。
      【参数】
      - page (可选): 页码，默认 1
      - page_size (可选): 每页条数，默认 20
      - tag (可选): 分类标签，省略/空串为全部
    routing: ths_news
    upstream_tool_mapping:
      thsdk: ths_news
    data_source_type: online
    dangerous: false
    params:
      - {name: page, type: int, required: false, description: "页码，默认 1"}
      - {name: page_size, type: int, required: false, description: "每页条数，默认 20"}
      - {name: tag, type: str, required: false, description: "分类标签，省略为全部"}

  - name: ths_block_constituents
    description: |-
      【板块成分】按板块 ID 或名称查询成分证券。
      对应 thsdk block_constituents(block, *, start=0, count=100)，start/count 为仅限关键字参数。
      【参数】
      - block (必填): 板块 ID（整数，如 61322）或名称（如 沪深300）
      - start (可选): 偏移量，默认 0
      - count (可选): 条数，网关默认 50（库默认 100）
    routing: ths_block_constituents
    upstream_tool_mapping:
      thsdk: ths_block_constituents
    data_source_type: online
    dangerous: false
    params:
      - {name: block, type: str, required: true, description: "板块 ID（整数，如 61322）或名称，如 沪深300"}
      - {name: start, type: int, required: false, description: "偏移量，默认 0"}
      - {name: count, type: int, required: false, description: "条数，默认 50"}

  - name: ths_market_securities
    description: |-
      【市场证券分页】分页列出指定市场中的证券。
      对应 thsdk list_market_securities(*, market, sort_begin, sort_count, sort_id, sort_order, func_period)。
      【参数】
      - market (必填): 市场前缀，如 USHA / USZA
      - start (可选): 偏移量，默认 0（内部名 sort_begin）
      - count (可选): 条数，默认 100（内部名 sort_count）
    routing: ths_market_securities
    upstream_tool_mapping:
      # 映射值是【网关 handler 键】（router 用它调 upstream.call_tool），
      # 不是原生函数名——handler _tool_ths_market_securities 内部才调原生
      # list_market_securities。曾误写 thsdk.list_market_securities /
      # list_market_securities 导致 Unknown tool。
      thsdk: ths_market_securities
    data_source_type: online
    dangerous: false
    params:
      - {name: market, type: str, required: true, description: "市场前缀，如 USHA / USZA"}
      - {name: start, type: int, required: false, description: "偏移量，默认 0（内部名 sort_begin）"}
      - {name: count, type: int, required: false, description: "条数，默认 100（内部名 sort_count）"}

  # ========== 账号自选写操作（仅 ALLOW_WATCHLIST_WRITE=true 时注册） ==========

  - name: ths_add_account_watchlist_securities
    description: |-
      [DANGEROUS WRITE] 修改同花顺账号自选，难以撤销，调用前必须确认用户意图。
      对应 add_account_watchlist_securities(*, securities, add_to_front)。向主自选追加证券；证券尽量传完整 THSCODE，短代码自动补全。
      【参数】
      - securities (必填): THSCODE 数组，如 ['USHA600519']
      - add_to_front (可选): 是否置顶添加，默认 false
    routing: ths_add_account_watchlist_securities
    upstream_tool_mapping:
      thsdk: ths_add_account_watchlist_securities
    requires_env: ALLOW_WATCHLIST_WRITE
    dangerous: true
    annotations: {read_only_hint: false, destructive_hint: true}
    data_source_type: online
    params:
      - {name: securities, type: "List[str]", required: true, description: "完整 THSCODE 数组，如 ['USHA600519']；短代码自动补全"}
      - {name: add_to_front, type: bool, required: false, description: "是否置顶添加，默认 false"}

  - name: ths_remove_account_watchlist_securities
    description: |-
      [DANGEROUS WRITE] 修改同花顺账号自选，调用前必须确认用户意图。
      对应 remove_account_watchlist_securities(*, securities)。从主自选移除证券。
