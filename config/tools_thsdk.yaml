      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_get_security_concept_tags
    upstream_tool_mapping:
      thsdk: ths_get_security_concept_tags
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}

  - name: ths_get_security_industry
    description: |-
      【行业分类】查询单只证券的行业分类。对应 get_security_industry(*, security)。
      【参数】security (必填): 完整 THSCODE，如 USHA600519
    routing: ths_get_security_industry
    upstream_tool_mapping:
      thsdk: ths_get_security_industry
    data_source_type: online
    dangerous: false
    params:
      - {name: security, type: str, required: true, description: "完整 THSCODE，如 USHA600519"}

  - name: ths_list_industry_children
    description: |-
      【子行业列表】查询某个行业对象下的子行业。对应 list_industry_children(*, industry)，industry 必须是行业对象（Mapping），原生不支持行业名称字符串。
      【参数】industry (必填): 行业对象——先调 ths_get_security_industry(security) 取其返回的 industry 字段原样传入
    routing: ths_list_industry_children
    upstream_tool_mapping:
      thsdk: ths_list_industry_children
    data_source_type: online
    dangerous: false
    params:
      - {name: industry, type: object, required: true, description: "行业对象（Mapping）：先调 ths_get_security_industry 取其 industry 字段原样传入；不支持名称字符串"}

  - name: ths_rank_block_securities
    description: |-
      【板块内排序】按原生排序字段对板块内证券排序分页。
      对应 rank_block_securities(*, block, sort_begin, sort_count, sort_id, sort_order, exclude_securities, exclude_blocks, func_period)。
      【参数】
      - block (必填): 板块 ID（整数，如 61322）或名称
      - start (可选): 起始位置，默认 0（内部名 sort_begin）
      - count (可选): 条数，默认 50（内部名 sort_count）
      - sort_id (可选): 原生排序字段代码，如 "55"（涨幅）；不传则用组件默认排序。具体代码以 thsdk 原生字段为准
      - order (可选): 排序方向，"D"=降序 / "A"=升序；不传用组件默认（示例默认 "D"）
    routing: ths_rank_block_securities
    upstream_tool_mapping:
      thsdk: ths_rank_block_securities
    data_source_type: online
    dangerous: false
    params:
      - {name: block, type: str, required: true, description: "板块 ID（整数，如 61322）或名称，如 沪深300"}
      - {name: start, type: int, required: false, description: "起始位置，默认 0（内部名 sort_begin）"}
      - {name: count, type: int, required: false, description: "返回条数，默认 50（内部名 sort_count）"}
      - {name: sort_id, type: str, required: false, description: "原生排序字段代码，如 55=涨幅；不传用默认排序"}
      - {name: order, type: str, required: false, enum: ["D", "A"], description: "排序方向：D=降序(默认示例) / A=升序"}

  - name: ths_rank_block_by_wencai_field
    description: |-
      【板块按字段排名】对板块内成分按任意问财字段（换手率 / 市盈率 / ROE / 净利润增速等）排名。
      对应 rank_block_securities_by_wencai_field(block, field, …)；网关按字段名自动解析完整问财字段。
      【参数】
      - block (必填): 板块数字 ID，如 61322
      - field_name (必填): 问财字段名，如 换手率 / 市盈率 / ROE
      - count (可选): 返回条数，默认 20
    routing: ths_rank_block_by_wencai_field
    upstream_tool_mapping:
      thsdk: ths_rank_block_by_wencai_field
    data_source_type: online
    dangerous: false
    params:
      - {name: block, type: int, required: true, description: "板块数字 ID，如 61322"}
      - {name: field_name, type: str, required: true, description: "问财字段名，如 换手率 / 市盈率 / ROE"}
      - {name: count, type: int, required: false, description: "返回条数，默认 20"}

  - name: ths_index_constituent_contribution
    description: |-
      【成分涨跌贡献度】对指数成分按当日涨跌贡献度排名，回答"谁拉动/拖累了指数"。
      对应 rank_constituents_by_performance_contribution(code, market, target, …)；与上方板块成分排名为姊妹方法。
      【参数】
      - code (必填): 指数代码，如 1A0001（上证指数；指数专用代码，非 6 位个股裸码）
      - market (可选): 指数市场前缀，默认 USHI（上证）；深证指数用 USZI
      - count (可选): 返回条数，默认 20
    routing: ths_index_constituent_contribution
    upstream_tool_mapping:
      thsdk: ths_index_constituent_contribution
    data_source_type: online
    dangerous: false
    params:
      - {name: code, type: str, required: true, description: "指数代码，如 1A0001"}
      - {name: market, type: str, required: false, description: "指数市场前缀，默认 USHI；深证用 USZI"}
      - {name: count, type: int, required: false, description: "返回条数，默认 20"}

