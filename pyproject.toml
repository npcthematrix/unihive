[project]
name = "unihive"
version = "0.1.1"
description = "UniHive MCP 网关 - 聚合多个金融数据 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.0,<3.0",
    "fastmcp>=4.0.3,<5.0",
    "fastapi>=0.110,<1.0",
    "sqlalchemy>=2.0.0,<3.0",
    "aiosqlite>=0.19.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
    "itsdangerous>=2.0,<3.0",
    "thsdk>=2.0,<3.0",
    "mootdx2>=1.4,<2.0",
    # mootdx2 的 native API 未实现分时 (get_history_minute_time_data), 今日分时
    # 走 tdxpy 直连兜底; 见 src/unihive/api/mootdx2_client.py 的 _minute_time_via_tdxpy
    "tdxpy>=0.2,<1.0",
    "orjson>=3.9,<4.0",
    "cachetools>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "asgi-lifespan>=2.0,<3.0",
]

[project.scripts]
unihive = "unihive.gateway_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 注意表名是 tool.hatch.* (hatchling 读这个); tool.hatchling.* 会被静默忽略,
# 2026-09-19 wheel 内容审计发现旧表名致 force-include 从未生效。
[tool.hatch.build.targets.wheel]
packages = ["src/unihive"]

# L13 (round 9 audit): wheel 只打包 src/ 包, console.html 与 static/ 在包外
# (repo 根), pip install 后会缺失 → 控制台路由返回 404。force-include 把它们
# 复制到 wheel 根 (site-packages/console.html, site-packages/static/...),
# console_api.resolve_console_html_path 据此定位 installed 布局。
#
# M1 (round 11 audit): v2 配置事实源是 data/config.db, 空库首启要从出厂
# YAML 模板 seed —— installed 布局 (site-packages/config/...) 缺模板会在
# seed 准入门 fail-closed ("No upstreams configured"), wheel 装出来的网关
# 每次首启都拒启。故把 seed 模板一并 force-include 到 wheel 根 config/。
# 刻意不打 config/config.yaml: 内含本机真实 session_secret + PBKDF2 口令
# 哈希 (非 ${VAR} 占位), 打进 wheel 等于分发本机凭据; installed 用户的
# 控制台凭据走 UNIHIVE_CONSOLE_* 环境变量。proxy_settings.yaml 同样不打:
# 缺失即 fail-soft 默认 disabled, 带上反而可能意外给 installed 用户启用代理。
[tool.hatch.build.targets.wheel.force-include]
"console.html" = "console.html"
"static" = "static"
"config/upstreams.yaml" = "config/upstreams.yaml"
"config/tools_tdx_quant.yaml" = "config/tools_tdx_quant.yaml"
"config/tools_mootdx2.yaml" = "config/tools_mootdx2.yaml"
"config/tools_omni.yaml" = "config/tools_omni.yaml"
"config/tools_thsdk.yaml" = "config/tools_thsdk.yaml"
"config/tools_ths_local.yaml" = "config/tools_ths_local.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
