[project]
name = "unihive"
version = "0.1.1"
description = "UniHive MCP 网关 - 聚合多个金融数据 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.0,<3.0",
    "fastmcp>=4.0.0,<5.0",
    "fastapi>=0.110,<1.0",
    "sqlalchemy>=2.0.0,<3.0",
    "aiosqlite>=0.19.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
    "itsdangerous>=2.0,<3.0",
    "thsdk>=2.0,<3.0",
    "mootdx2>=1.4,<2.0",
    "orjson>=3.9,<4.0",
    "cachetools>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "asgi-lifespan>=2.0,<3.0",
]

[project.scripts]
unihive = "unihive.gateway_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src"]

# L13 (round 9 audit): wheel 只打包 src/ 包, console.html 与 static/ 在包外
# (repo 根), pip install 后会缺失 → 控制台路由返回 404。force-include 把它们
# 复制到 wheel 根 (site-packages/console.html, site-packages/static/...),
# console_api.resolve_console_html_path 据此定位 installed 布局。
[tool.hatchling.build.force-include]
"console.html" = "console.html"
"static" = "static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
