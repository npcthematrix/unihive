[project]
name = "unihive"
version = "0.1.1"
description = "UniHive MCP 网关 - 聚合多个金融数据 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.0,<3.0",
    "fastmcp>=4.0.0,<5.0",
    "sqlalchemy>=2.0.0,<3.0",
    "aiosqlite>=0.19.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
