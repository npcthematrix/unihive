<!--
  UniHive wordmark 横排 (深底版): 与 light 同几何, 配色反白。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="wm-stroke-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="wm-node-d" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </radialGradient>
    <radialGradient id="wm-glass-d" cx="0.3" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#wm-stroke-d)" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="48" y1="6"  x2="48" y2="30"/>
    <line x1="87" y1="27" x2="63.6" y2="39"/>
    <line x1="87" y1="69" x2="63.6" y2="57"/>
    <line x1="48" y1="90" x2="48" y2="66"/>
    <line x1="9"  y1="69" x2="32.4" y2="57"/>
    <line x1="9"  y1="27" x2="32.4" y2="39"/>
  </g>
  <circle cx="48" cy="48" r="18" fill="url(#wm-node-d)"/>
  <polygon
    points="48,38 55.6,42.5 55.6,52.5 48,57 40.4,52.5 40.4,42.5"
    fill="none" stroke="#0f172a" stroke-width="1.4" stroke-opacity="0.55" stroke-linejoin="round"/>
  <circle cx="48" cy="48" r="18" fill="url(#wm-glass-d)"/>

  <text x="108" y="62" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" font-size="40" fill="#e2e8f0" letter-spacing="-0.5">UniHive</text>
  <text x="109" y="80" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="9" fill="#94a3b8" letter-spacing="2.4">MCP · AGGREGATE</text>
</svg>