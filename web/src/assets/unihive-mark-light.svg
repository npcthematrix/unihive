<!--
  UniHive 应用 mark (浅底版): 蜂巢 + 太极
  ─────────────────────────────────────────────────
  六边形蜂巢轮廓 + 蓝白太极图案 (数据阴阳汇聚)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="uh-yang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="uh-white" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </radialGradient>
  </defs>

  <!-- 蜂巢外轮廓 (六边形) -->
  <polygon
    points="88,48 68,17.4 28,17.4 8,48 28,78.6 68,78.6"
    fill="#EFF6FF"
    stroke="url(#uh-stroke)" stroke-width="4"
    stroke-linejoin="round"/>

  <!-- 太极图案 (居中) -->
  <g transform="translate(48, 48)">
    <!-- 灰色边框 -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- 阴鱼 (白) -->
    <path d="M0,-16 A16,16 0 0,1 0,16 A8,8 0 0,1 0,0 A8,8 0 0,0 0,-16" fill="url(#uh-white)"/>
    <!-- 阳鱼 (蓝) -->
    <path d="M0,16 A16,16 0 0,1 0,-16 A8,8 0 0,1 0,0 A8,8 0 0,0 0,16" fill="url(#uh-yang)"/>
    <!-- 阴眼 (蓝) -->
    <circle cx="0" cy="-8" r="3" fill="#3B82F6"/>
    <!-- 阳眼 (白) -->
    <circle cx="0" cy="8" r="3" fill="#FFFFFF"/>
  </g>
</svg>
