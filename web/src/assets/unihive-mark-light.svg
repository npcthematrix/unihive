<!-- UniHive 品牌标 (浅底版: 登录页/白卡)。与 web/public/favicon.svg 同几何, 改一处记得同步。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d94ff"/>
      <stop offset="0.55" stop-color="#1a6ff5"/>
      <stop offset="1" stop-color="#0a4fc4"/>
    </linearGradient>
    <linearGradient id="uh-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5564f"/>
      <stop offset="1" stop-color="#cf1f1f"/>
    </linearGradient>
  </defs>
  <!-- hive cell: six-source aggregation — bare mark, no app tile -->
  <polygon
    points="57,32 44.5,54.2 19.5,54.2 7,32 19.5,9.8 44.5,9.8"
    fill="#0d6efd" fill-opacity="0.07"
    stroke="url(#uh-hex)" stroke-width="5"
    stroke-linejoin="round"/>
  <!-- three ascending candlesticks: 红涨绿跌 (A 股配色), 中间红柱为视觉焦点
       线 bbox 宽为 0, 竖渐变不渲染 (SVG 规范坑) —— 柱体用渐变, 影线用实色 -->
  <g stroke-linecap="round">
    <line x1="24.5" y1="25.5" x2="24.5" y2="44.5" stroke="#2b9e5f" stroke-width="2.8"/>
    <rect x="21.7" y="30.5" width="5.6" height="9" rx="1.4" fill="#2b9e5f"/>
    <line x1="32" y1="21.5" x2="32" y2="45.5" stroke="#cf1f1f" stroke-width="3"/>
    <rect x="29.3" y="26" width="5.6" height="13.5" rx="1.4" fill="url(#uh-red)"/>
    <line x1="39.5" y1="25.5" x2="39.5" y2="43" stroke="#147a44" stroke-width="2.8"/>
    <rect x="36.7" y="29.5" width="5.6" height="10" rx="1.4" fill="#147a44"/>
  </g>
</svg>
