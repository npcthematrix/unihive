<!--
  UniHive 应用 mark (浅底版): 蜂巢轮廓 + 内部数据流汇聚
  ─────────────────────────────────────────────────
  外轮廓: 六边形 (蜂巢), 平顶朝右 — "Hive" 视觉隐喻
  内部: 6 条入线 (60° 间隔) 从蜂巢 6 个内角向中心节点汇聚 — "Uni" 视觉隐喻
  中心节点: 微缩蜂巢描边 + 玻璃高光, 圆+六边形双层焦点

  配色: 蓝 → 青绿径向, 玻璃高光左上 40% 白模糊。
  改此处同步 dark + favicon + wordmark。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a8c"/>
      <stop offset="0.6" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="uh-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e3a8c"/>
    </radialGradient>
    <radialGradient id="uh-glass" cx="0.3" cy="0.3" r="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 蜂巢外轮廓 (六边形, 平顶朝右) — 渐变描边 -->
  <polygon
    points="88,48 68,17.4 28,17.4 8,48 28,78.6 68,78.6"
    fill="#ffffff" fill-opacity="0.04"
    stroke="url(#uh-stroke)" stroke-width="5"
    stroke-linejoin="round"/>

  <!-- 6 条入线 (60° 间隔), 从六边形内角缩进 12px → 中心节点边缘 (r=12) -->
  <g stroke="url(#uh-stroke)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.78">
    <line x1="76"   y1="48"    x2="60"  y2="48"/>    <!-- 右 -->
    <line x1="62"   y1="23.75" x2="54"  y2="37.6"/>  <!-- 右上 -->
    <line x1="34"   y1="23.75" x2="42"  y2="37.6"/>  <!-- 左上 -->
    <line x1="20"   y1="48"    x2="36"  y2="48"/>    <!-- 左 -->
    <line x1="34"   y1="72.25" x2="42"  y2="58.4"/>  <!-- 左下 -->
    <line x1="62"   y1="72.25" x2="54"  y2="58.4"/>  <!-- 右下 -->
  </g>

  <!-- 中心节点圆环 (径向渐变填色) -->
  <circle cx="48" cy="48" r="12" fill="url(#uh-node)"/>

  <!-- 节点内嵌微缩蜂巢描边 — 内外蜂巢呼应, 强化"Hive"识别 -->
  <polygon
    points="48,40 55.6,44.5 55.6,53.5 48,58 40.4,53.5 40.4,44.5"
    fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" stroke-linejoin="round"/>

  <!-- 玻璃高光 (左上偏淡) -->
  <circle cx="48" cy="48" r="12" fill="url(#uh-glass)"/>
</svg>