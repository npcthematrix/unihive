<!--
  UniHive 应用 mark (深底反白版): 与 unihive-mark-light.svg 同几何, 仅配色不同。
  玻璃高光保留 (侧边栏深色背景需要更亮的高光锚定焦点)。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-stroke-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="uh-node-dark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </radialGradient>
    <radialGradient id="uh-glass-dark" cx="0.3" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#uh-stroke-dark)" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="48" y1="6"  x2="48" y2="30"/>
    <line x1="87" y1="27" x2="63.6" y2="39"/>
    <line x1="87" y1="69" x2="63.6" y2="57"/>
    <line x1="48" y1="90" x2="48" y2="66"/>
    <line x1="9"  y1="69" x2="32.4" y2="57"/>
    <line x1="9"  y1="27" x2="32.4" y2="39"/>
  </g>

  <circle cx="48" cy="48" r="18" fill="url(#uh-node-dark)"/>

  <polygon
    points="48,38 55.6,42.5 55.6,52.5 48,57 40.4,52.5 40.4,42.5"
    fill="none" stroke="#0f172a" stroke-width="1.4" stroke-opacity="0.55" stroke-linejoin="round"/>

  <circle cx="48" cy="48" r="18" fill="url(#uh-glass-dark)"/>
</svg>