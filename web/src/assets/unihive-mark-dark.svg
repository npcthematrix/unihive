<!-- UniHive 品牌标 (深底反白版: 侧边栏)。与 unihive-mark-light.svg 同几何, 仅配色不同。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-hex-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ec5ff"/>
      <stop offset="0.55" stop-color="#69b1ff"/>
      <stop offset="1" stop-color="#2f7cf6"/>
    </linearGradient>
    <linearGradient id="uh-red-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#f04438"/>
    </linearGradient>
  </defs>
  <!-- hive cell: six-source aggregation — bare mark, no app tile -->
  <polygon
    points="57,32 44.5,54.2 19.5,54.2 7,32 19.5,9.8 44.5,9.8"
    fill="#69b1ff" fill-opacity="0.10"
    stroke="url(#uh-hex-d)" stroke-width="5"
    stroke-linejoin="round"/>
  <!-- three ascending candlesticks: 红涨绿跌 (A 股配色, 深底提亮一档)
       线 bbox 宽为 0, 竖渐变不渲染 (SVG 规范坑) —— 柱体用渐变, 影线用实色 -->
  <g stroke-linecap="round">
    <line x1="24.5" y1="25.5" x2="24.5" y2="44.5" stroke="#52d68a" stroke-width="2.8"/>
    <rect x="21.7" y="30.5" width="5.6" height="9" rx="1.4" fill="#52d68a"/>
    <line x1="32" y1="21.5" x2="32" y2="45.5" stroke="#f04438" stroke-width="3"/>
    <rect x="29.3" y="26" width="5.6" height="13.5" rx="1.4" fill="url(#uh-red-d)"/>
    <line x1="39.5" y1="25.5" x2="39.5" y2="43" stroke="#2eb567" stroke-width="2.8"/>
    <rect x="36.7" y="29.5" width="5.6" height="10" rx="1.4" fill="#2eb567"/>
  </g>
</svg>
