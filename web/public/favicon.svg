<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#0d6efd"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#uh-bg)"/>
  <!-- hive cell: six-source aggregation -->
  <polygon
    points="51.5,32 41.75,48.9 22.25,48.9 12.5,32 22.25,15.1 41.75,15.1"
    fill="#ffffff" fill-opacity="0.10"
    stroke="#ffffff" stroke-width="3.2"
    stroke-linejoin="round"/>
  <!-- three ascending candlesticks: market data -->
  <g stroke-linecap="round">
    <line x1="25" y1="28" x2="25" y2="42" stroke="#ffffff" stroke-width="2"/>
    <rect x="22.9" y="33" width="4.2" height="7" rx="1" fill="#ffffff"/>
    <line x1="32" y1="25" x2="32" y2="43" stroke="#ffd666" stroke-width="2"/>
    <rect x="29.9" y="29" width="4.2" height="11" rx="1" fill="#ffd666"/>
    <line x1="39" y1="28" x2="39" y2="40" stroke="#ffffff" stroke-width="2"/>
    <rect x="36.9" y="31" width="4.2" height="8" rx="1" fill="#ffffff"/>
  </g>
</svg>
