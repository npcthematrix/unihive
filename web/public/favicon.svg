<!--
  UniHive favicon — 按侧栏品牌 logo (src/assets/unihive-logo.png) 重绘。
  2026-10-17: 旧版内部是太极图, 与 logo 的三柱图不一致, 且太极在 16×16
  下会糊成一团。现在保留蜂巢六边形轮廓, 内部换成与 logo 同构的三根柱状
  + 顶部高光点 —— 三根竖条在小尺寸下仍可分辨。

  同目录的 favicon.png (512, 透明底) 与 apple-touch-icon.png (180, 白底)
  都是本文件的栅格化产物, 改完这里必须重新生成, 否则位图仍是旧图形。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniHive">
  <title>UniHive</title>
  <defs>
    <linearGradient id="uh-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="uh-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- 蜂巢外轮廓 (六边形, 与 logo 同比例) -->
  <polygon
    points="58.67,32 45.33,11.6 18.67,11.6 5.33,32 18.67,52.4 45.33,52.4"
    fill="#7C3AED" fill-opacity="0.1"
    stroke="url(#uh-frame)" stroke-width="3.5"
    stroke-linejoin="round"/>

  <!-- 三根柱状 (中柱最高), 柱宽 6 / 间距 5 —— 16px 下仍留得出一条缝 -->
  <g fill="url(#uh-bar)">
    <rect x="18" y="31" width="6" height="11" rx="1.2"/>
    <rect x="29" y="23" width="6" height="19" rx="1.2"/>
    <rect x="40" y="28" width="6" height="14" rx="1.2"/>
  </g>

  <!-- 顶部高光点 -->
  <circle cx="32" cy="25" r="2.3" fill="#E879F9"/>
</svg>
