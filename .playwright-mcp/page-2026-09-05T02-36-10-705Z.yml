      - generic [ref=f1e1942]:
        - heading "1. 快速开始" [level=3] [ref=f1e1943]
        - paragraph [ref=f1e1944]: UniHive MCP 是一个统一的金融数据网关，把通达信、同花顺等数据源聚合在同一个 MCP 接口后面。
        - heading "1.1 启动网关" [level=4] [ref=f1e1945]
        - paragraph [ref=f1e1946]:
          - text: 网关默认以
          - strong [ref=f1e1947]: HTTP 模式
          - text: 启动（推荐），同时也支持 STDIO 模式。在项目根目录下运行：
        - generic [ref=f1e1948]:
          - button "复制 HTTP 启动命令" [ref=f1e1949] [cursor=pointer]
          - button "复制仅控制台命令" [ref=f1e1950] [cursor=pointer]
          - button "复制 STDIO 启动命令" [ref=f1e1951] [cursor=pointer]
        - generic [ref=f1e1952]:
          - button "复制" [ref=f1e1953] [cursor=pointer]
          - generic [ref=f1e1954]: .\scripts\start_all.ps1
        - paragraph [ref=f1e1955]:
          - text: 启动后，控制台默认监听
          - code [ref=f1e1956]: http://127.0.0.1:18080
          - text: ，HTTP 网关（同时启用）监听
          - code [ref=f1e1957]: http://127.0.0.1:18081/mcp
          - text: 。
        - heading "1.2 配置文件" [level=4] [ref=f1e1958]
        - paragraph [ref=f1e1959]:
          - text: 上游数据源在
          - code [ref=f1e1960]: config/upstreams.yaml
          - text: 中配置。修改后需要重启网关生效。
        - heading "2. 接入方式" [level=3] [ref=f1e1961]
        - heading "2.1 HTTP 模式（推荐）" [level=4] [ref=f1e1962]
        - paragraph [ref=f1e1963]:
          - text: 网关以
          - strong [ref=f1e1964]: Streamable HTTP
          - text: 模式对外提供 MCP 接口，监听
          - code [ref=f1e1965]: http://127.0.0.1:18081/mcp
          - text: 。运行
          - code [ref=f1e1966]: .\scripts\start_console.ps1
          - text: 会同时启动控制台和 HTTP 网关。
        - paragraph [ref=f1e1967]:
          - strong [ref=f1e1968]: Claude Desktop / Cursor 配置：
        - generic [ref=f1e1969]:
          - button "复制" [ref=f1e1970] [cursor=pointer]
          - generic [ref=f1e1971]: "{ \"mcpServers\": { \"unihive\": { \"url\": \"http://127.0.0.1:18081/mcp\" } } }"
        - paragraph [ref=f1e1972]:
          - strong [ref=f1e1973]: Python SDK 示例：
        - generic [ref=f1e1974]:
          - button "复制" [ref=f1e1975] [cursor=pointer]
          - generic [ref=f1e1976]: "import asyncio from fastmcp.client import Client async def main(): async with Client(\"http://127.0.0.1:18081/mcp\") as client: tools = await client.list_tools() result = await client.call_tool(\"get_realtime_quote\", {\"symbol\": \"600000\"}) print(result.data) asyncio.run(main())"
        - heading "2.2 STDIO 模式（备选）" [level=4] [ref=f1e1977]
        - paragraph [ref=f1e1978]: 用于不支持 HTTP MCP 的旧客户端，或本地脚本场景。需要单独启动 gateway 进程：
        - generic [ref=f1e1979]:
          - button "复制" [ref=f1e1980] [cursor=pointer]
          - generic [ref=f1e1981]: "{ \"mcpServers\": { \"unihive\": { \"command\": \"python\", \"args\": [\"-m\", \"src.gateway_server\", \"--transport\", \"stdio\"], \"cwd\": \"D:/fintech_workspace/unihive\" } } }"
        - paragraph [ref=f1e1982]: 或命令行单独启动 STDIO 模式：
        - generic [ref=f1e1983]:
          - button "复制" [ref=f1e1984] [cursor=pointer]
          - generic [ref=f1e1985]: python -m src.gateway_server --transport stdio
        - heading "3. MCP APIs" [level=3] [ref=f1e1986]
