        - heading "4. 常用示例" [level=3] [ref=e185]
        - heading "4.1 Python SDK（推荐）" [level=4] [ref=e186]
        - paragraph [ref=e187]:
          - text: 通过
          - link "FastMCP" [ref=e188] [cursor=pointer]:
            - /url: https://github.com/jlowin/fastmcp
          - text: 客户端连接 HTTP 网关（默认
          - code [ref=e189]: http://127.0.0.1:18081/mcp
          - text: ）。所有 tool 名、参数和返回结构以
          - strong [ref=e190]: "\"MCP APIs\""
          - text: 标签页为准。
        - generic [ref=e191]:
          - button "复制" [ref=e192] [cursor=pointer]
          - generic [ref=e193]: "import asyncio from fastmcp.client import Client GATEWAY_URL = \"http://127.0.0.1:18081/mcp\" async def main(): async with Client(GATEWAY_URL) as client: # 1) 列工具名 tools = await client.list_tools() print(\"available tools:\", [t.name for t in tools]) # 2) 调用实时行情（任意上游的 tool 都能这样调） quote = await client.call_tool( \"get_realtime_quote\", {\"symbol\": \"sh600519\"} ) print(quote.data) asyncio.run(main())"
        - heading "4.2 日 K 线（含日期范围）" [level=4] [ref=e194]
        - generic [ref=e195]:
          - button "复制" [ref=e196] [cursor=pointer]
          - generic [ref=e197]: "bar = await client.call_tool( \"get_daily_bar\", {\"symbol\": \"sh600519\", \"start_date\": \"20260101\", \"end_date\": \"20260301\"} ) print(bar.data)"
        - heading "4.3 搜索股票" [level=4] [ref=e198]
        - generic [ref=e199]:
          - button "复制" [ref=e200] [cursor=pointer]
          - generic [ref=e201]: "match = await client.call_tool( \"search_stock\", {\"keyword\": \"茅台\"} ) print(match.data)"
        - generic [ref=e202]:
          - strong [ref=e203]: 提示：
          - text: 如果你的客户端只支持 stdio，启动 STDIO 模式：
          - code [ref=e204]: python -m src.gateway_server --transport stdio
          - text: 。 调试可用 MCP Inspector（
          - code [ref=e205]: npx -y @modelcontextprotocol/inspector
          - text: ），Python 可用官方 SDK（
          - code [ref=e206]: from mcp import ClientSession, StdioServerParameters
          - text: ）。Windows 下
          - code [ref=e207]: cwd
          - text: 用项目绝对路径。
        - heading "5. 故障排查" [level=3] [ref=e208]
        - heading "5.1 连接失败" [level=4] [ref=e209]
        - list [ref=e210]:
          - listitem [ref=e211]:
            - text: 检查网关是否已启动：访问
            - code [ref=e212]: http://127.0.0.1:18080
          - listitem [ref=e213]:
            - text: 检查客户端配置中的
            - code [ref=e214]: cwd
            - text: 路径是否正确
          - listitem [ref=e215]: Windows 下确认 Python 已加入 PATH
        - heading "5.2 接口返回错误" [level=4] [ref=e216]
        - list [ref=e217]:
          - listitem [ref=e218]: 查看控制台"上游状态"标签页，确认对应上游是否在线
          - listitem [ref=e219]:
            - text: 查看返回的
            - code [ref=e220]: last_error
            - text: 字段
          - listitem [ref=e221]:
            - text: 对应上游若被禁用，需修改
            - code [ref=e222]: config/upstreams.yaml
            - text: 并重启
        - heading "5.3 参数错误" [level=4] [ref=e223]
        - list [ref=e224]:
          - listitem [ref=e225]:
            - text: 股票代码由网关自动标准化（
            - code [ref=e226]: "000001"
            - text: 、
            - code [ref=e227]: sh600519
            - text: 、
            - code [ref=e228]: 600519.SH
            - text: 、
            - code [ref=e229]: sz000001
            - text: 都能识别
          - listitem [ref=e230]:
            - text: 日期统一使用
            - code [ref=e231]: YYYYMMDD
            - text: （如
            - code [ref=e232]: "20260301"
            - text: ）
          - listitem [ref=e233]:
            - text: 具体参数以
            - strong [ref=e234]: "\"MCP APIs\""
            - text: 标签页每个 tool 行的"详情"展开为准
        - heading "5.4 反馈渠道" [level=4] [ref=e235]
        - paragraph [ref=e236]:
          - text: 遇到问题请提交 Issue 到
          - link "github.com/unihive/unihive" [ref=e237] [cursor=pointer]:
            - /url: https://github.com/unihive/unihive
          - text: ",并附上控制台截图与接口返回内容。点击"
          - strong [ref=e238]: "\"MCP APIs\""
          - text: → 对应 tool 行 →
          - code [ref=e239]: 复制
          - text: 按钮即可拿到完整 tool 名与参数。