        - heading "1. 快速开始" [level=3] [ref=e101]
        - paragraph [ref=e102]: UniHive MCP 是一个统一的金融数据网关，把通达信、同花顺、Tushare 等多个数据源聚合在同一个 MCP 接口后面。
        - heading "1.1 启动网关" [level=4] [ref=e103]
        - paragraph [ref=e104]:
          - text: 网关默认以
          - strong [ref=e105]: HTTP 模式
          - text: 启动（推荐），同时也支持 STDIO 模式。在项目根目录下运行：
        - generic [ref=e106]:
          - button "复制 HTTP 启动命令" [ref=e107] [cursor=pointer]
          - button "复制仅控制台命令" [ref=e108] [cursor=pointer]
          - button "复制 STDIO 启动命令" [ref=e109] [cursor=pointer]
        - generic [ref=e110]:
          - button "复制" [ref=e111] [cursor=pointer]
          - generic [ref=e112]: .\scripts\start_all.ps1
        - paragraph [ref=e113]:
          - text: 启动后，控制台默认监听
          - code [ref=e114]: http://127.0.0.1:18080
          - text: ，HTTP 网关（同时启用）监听
          - code [ref=e115]: http://127.0.0.1:18081/mcp
          - text: 。
        - heading "1.2 配置文件" [level=4] [ref=e116]
        - paragraph [ref=e117]:
          - text: 上游数据源在
          - code [ref=e118]: config/upstreams.yaml
          - text: 中配置。修改后需要重启网关生效。
        - heading "2. 接入方式" [level=3] [ref=e119]
        - heading "2.1 HTTP 模式（推荐）" [level=4] [ref=e120]
        - paragraph [ref=e121]:
          - text: 网关以
          - strong [ref=e122]: Streamable HTTP
          - text: 模式对外提供 MCP 接口，监听
          - code [ref=e123]: http://127.0.0.1:18081/mcp
          - text: 。运行
          - code [ref=e124]: .\scripts\start_console.ps1
          - text: 会同时启动控制台和 HTTP 网关。
        - paragraph [ref=e125]:
          - strong [ref=e126]: Claude Desktop / Cursor 配置：
        - generic [ref=e127]:
          - button "复制" [ref=e128] [cursor=pointer]
          - generic [ref=e129]: "{ \"mcpServers\": { \"unihive\": { \"url\": \"http://127.0.0.1:18081/mcp\" } } }"
        - paragraph [ref=e130]:
          - strong [ref=e131]: Python SDK 示例：
        - generic [ref=e132]:
          - button "复制" [ref=e133] [cursor=pointer]
          - generic [ref=e134]: "import asyncio from fastmcp.client import Client async def main(): async with Client(\"http://127.0.0.1:18081/mcp\") as client: tools = await client.list_tools() result = await client.call_tool(\"get_realtime_quote\", {\"symbol\": \"600000\"}) print(result.data) asyncio.run(main())"
        - heading "2.2 STDIO 模式（备选）" [level=4] [ref=e135]
        - paragraph [ref=e136]: 用于不支持 HTTP MCP 的旧客户端，或本地脚本场景。需要单独启动 gateway 进程：
        - generic [ref=e137]:
          - button "复制" [ref=e138] [cursor=pointer]
          - generic [ref=e139]: "{ \"mcpServers\": { \"unihive\": { \"command\": \"python\", \"args\": [\"-m\", \"src.gateway_server\", \"--transport\", \"stdio\"], \"cwd\": \"D:/fintech_workspace/unihive\" } } }"
        - paragraph [ref=e140]: 或命令行单独启动 STDIO 模式：
        - generic [ref=e141]:
          - button "复制" [ref=e142] [cursor=pointer]
          - generic [ref=e143]: python -m src.gateway_server --transport stdio
