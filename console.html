<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniHive Console</title>
    <link rel="icon" type="image/svg+xml" href="/static/console/favicon.svg?v=5bc99db8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/static/console/favicon.png?v=5bc99db8" />
    <!-- iOS 的 apple-touch-icon 只认 PNG, 指向 SVG 会被静默忽略 (旧配置即如此) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/console/apple-touch-icon.png?v=5bc99db8" />
    <meta name="theme-color" content="#0e3a8c" />
    <meta name="description" content="UniHive — 金融数据 MCP 聚合网关, 统一 /mcp 端点, 多源上游路由。" />
    <style>
      /* Round-13 簇M: 内联启动标记 —— 不依赖任何 bundle 资源,
         HTML 一解析完就渲染 (JS 下载/解析期间不再白屏)。
         Vue mount 会整体替换 #app 内容。配色与登录页/
         App.vue 启动门保持一致, 切换时无闪烁。 */
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 100%);
        color: rgba(255, 255, 255, 0.82);
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        font-size: 14px;
      }
      #app-boot .boot-mark {
        width: 64px;
        height: 64px;
        /* 与 App.vue 的 .boot-mark 同款: 品牌蓝 #3B82F6 的柔光 (原为青色,
           与主色不属同一色相) */
        filter: drop-shadow(0 4px 16px rgba(59, 130, 246, 0.35));
      }
      #app-boot .boot-wordmark {
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        font-weight: 600;
        font-size: 22px;
        letter-spacing: -0.3px;
        background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #app-boot .boot-tagline {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        letter-spacing: 2.4px;
        color: rgba(148, 163, 184, 0.7);
        margin-top: -8px;
      }
      #app-boot .boot-spinner {
        width: 22px;
        height: 22px;
        margin-top: 6px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-top-color: rgba(147, 197, 253, 0.9);
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-spinner {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/static/console/assets/index-D09q7xb2.js"></script>
    <link rel="modulepreload" crossorigin href="/static/console/assets/vue-hmD7xhy6.js">
    <link rel="modulepreload" crossorigin href="/static/console/assets/element-plus-DlwqTlkm.js">
    <link rel="stylesheet" crossorigin href="/static/console/assets/index-D8a_i0R4.css">
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <img class="boot-mark" src="/static/console/favicon.svg?v=5bc99db8" alt="" aria-hidden="true" />
        <div class="boot-wordmark">UniHive</div>
        <div class="boot-tagline">MCP · AGGREGATE</div>
        <div class="boot-spinner" role="status" aria-label="启动中"></div>
        <div>正在启动 UniHive Console…</div>
      </div>
    </div>
  </body>
</html>
