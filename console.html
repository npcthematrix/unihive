<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniHive Console</title>
    <link rel="icon" type="image/svg+xml" href="/static/console/favicon.svg" />
    <style>
      /* Round-13 簇M: 内联启动标记 —— 不依赖任何 bundle 资源,
         HTML 一解析完就渲染 (JS 下载/解析期间不再白屏)。
         Vue mount 会整体替换 #app 内容。配色与登录页/
         App.vue 启动门保持一致, 切换时无闪烁。 */
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1d2733 0%, #2c3e55 55%, #3a506b 100%);
        color: rgba(255, 255, 255, 0.82);
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        font-size: 14px;
      }
      #app-boot .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: rgba(255, 255, 255, 0.88);
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-spinner {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/static/console/assets/index-9UBOdT3W.js"></script>
    <link rel="modulepreload" crossorigin href="/static/console/assets/vue-hmD7xhy6.js">
    <link rel="modulepreload" crossorigin href="/static/console/assets/element-plus-D8yFet9M.js">
    <link rel="stylesheet" crossorigin href="/static/console/assets/index-ydQif12v.css">
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <div class="boot-spinner" role="status" aria-label="启动中"></div>
        <div>正在启动 UniHive Console…</div>
      </div>
    </div>
  </body>
</html>
